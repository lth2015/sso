name: Build and publish service images

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: service-images-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/console/package-lock.json
      - name: Build embedded React console
        run: |
          bash scripts/build-console
          test -s internal/consoleui/static/index.html
          test -d internal/consoleui/static/assets
      - name: Validate managed QA configuration
        run: |
          python3 scripts/reconcile-qa --validate
          python3 -m unittest discover -s tests/ci -v
      - name: Test Go packages
        run: go test ./...
      - name: Test isolated BFF storage and revocation
        run: bash scripts/test-bff-isolation
      - name: Test database migration gates on disposable MySQL
        run: bash scripts/test-migrations
      - name: Build Linux service binaries
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
        run: |
          mkdir -p .local
          go build -trimpath -ldflags='-s -w' -o .local/db-migrate ./cmd/db-migrate
          go build -trimpath -ldflags='-s -w' -o .local/console-bff ./cmd/demo-app
          go build -trimpath -ldflags='-s -w' -o .local/platform-api ./cmd/platform-api
          go build -trimpath -ldflags='-s -w' -o .local/identity-api ./cmd/identity-api
          go build -trimpath -ldflags='-s -w' -o .local/event-worker ./cmd/event-worker
      - uses: actions/upload-artifact@v4
        with:
          name: linux-amd64-service-binaries
          path: |
            .local/console-bff
            .local/platform-api
            .local/identity-api
            .local/event-worker
            .local/db-migrate
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  images:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [console-bff, platform-api, identity-api, event-worker, db-migrate]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-amd64-service-binaries
          path: .local
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
          SERVICE: ${{ matrix.service }}
        run: echo "name=ghcr.io/${REPOSITORY,,}-${SERVICE}" >> "$GITHUB_OUTPUT"
      - name: Build and optionally publish
        id: container
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/images/Dockerfile
          build-args: BINARY=${{ matrix.service }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/master' }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:master
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=${{ matrix.service }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          provenance: mode=min
          sbom: true
      - name: Record published digest
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.container.outputs.digest }}
        run: |
          printf '### %s\n\n`%s@%s`\n' '${{ matrix.service }}' "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"

      - name: Save release image reference
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.container.outputs.digest }}
          SERVICE: ${{ matrix.service }}
        run: |
          mkdir -p release
          printf '%s@%s\n' "$IMAGE" "$DIGEST" > "release/$SERVICE"
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        with:
          name: release-${{ matrix.service }}
          path: release/${{ matrix.service }}
          if-no-files-found: error
          retention-days: 30

  deploy:
    name: Deploy QA
    needs: images
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    # Use a QA runner label here if the GKE API is reachable only from a private network.
    runs-on: ${{ vars.QA_DEPLOY_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 40
    environment: qa
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: sso-deploy-qa
      cancel-in-progress: false
    steps:
      - name: Reject superseded releases
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.repos.getBranch({
              ...context.repo, branch: context.ref.replace('refs/heads/', '')
            });
            if (data.commit.sha !== context.sha) {
              core.setFailed('A newer commit exists on this branch; deploy its successful run instead.');
            }
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - uses: azure/setup-kubectl@v4
        with:
          version: ${{ vars.KUBECTL_VERSION || 'v1.36.0' }}
      - name: Validate federation configuration
        env:
          PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          SERVICE_ACCOUNT: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
        run: |
          : "${PROVIDER:?Set qa secret GCP_WORKLOAD_IDENTITY_PROVIDER}"
          : "${SERVICE_ACCOUNT:?Set qa secret GCP_DEPLOY_SERVICE_ACCOUNT}"
      - name: Inspect federation identity claims
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken();
            const claims = JSON.parse(Buffer.from(token.split('.')[1], 'base64url').toString());
            const fields = ['sub', 'repository_id', 'repository_owner_id', 'ref', 'workflow_ref'];
            core.info(JSON.stringify(Object.fromEntries(fields.map(key => [key, claims[key]]))));
      - name: Authenticate to GCP using GitHub OIDC
        uses: google-github-actions/auth@v3
        with:
          project_id: netstars-ai-projects-qa
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - name: Get QA cluster credentials
        uses: google-github-actions/get-gke-credentials@v3
        with:
          project_id: netstars-ai-projects-qa
          cluster_name: qa-gcp-tokyo-ai-gke-latest
          location: asia-northeast1
          use_dns_based_endpoint: ${{ secrets.GKE_USE_DNS_ENDPOINT == 'true' }}
          use_internal_ip: ${{ vars.GKE_USE_INTERNAL_IP == 'true' }}
      - name: Deploy the matching image digests and verify rollouts
        env:
          RELEASE_DIR: release
          RELEASE_SHA: ${{ github.sha }}
        run: bash scripts/deploy-qa
      - name: Verify QA public endpoints and login redirect
        run: python3 scripts/verify-qa
