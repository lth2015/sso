name: Publish container images

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-images-master
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/console/package-lock.json

      - name: Build console assets
        run: |
          npm ci --prefix web/console --no-audit --no-fund
          npm run --prefix web/console build

      - name: Test Go packages
        run: go test ./...

      - name: Build Linux binaries
        run: |
          mkdir -p .local
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags='-s -w' -o .local/identity-api ./cmd/identity-api
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags='-s -w' -o .local/event-worker ./cmd/event-worker
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags='-s -w' -o .local/platform-api ./cmd/platform-api
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags='-s -w' -o .local/token-policy-hook ./cmd/token-policy-hook
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags='-s -w' -o .local/demo-app ./cmd/demo-app
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags='-s -w' -o .local/demo-admin ./cmd/demo-admin
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags='-s -w' -o .local/protocol-public ./cmd/protocol-public

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push images
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          while IFS='|' read -r name dockerfile; do
            image="ghcr.io/${GITHUB_REPOSITORY}-${name}"
            docker buildx build \
              --platform linux/amd64 \
              --file "$dockerfile" \
              --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
              --tag "${image}:${GITHUB_SHA}" \
              --tag "${image}:master" \
              --push \
              .
          done <<'IMAGES'
          identity-api|deploy/local/Dockerfile.accounts
          platform-api|deploy/local/Dockerfile.api
          token-policy-hook|deploy/local/Dockerfile.hook
          demo|deploy/local/Dockerfile.demo
          IMAGES
