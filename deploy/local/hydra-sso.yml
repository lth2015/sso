urls:
  self:
    issuer: http://auth.localhost:4464/
  login: http://auth.localhost:8080/login
  consent: http://auth.localhost:8080/consent
strategies:
  access_token: jwt
oauth2:
  expose_internal_errors: false
  pkce:
    enforced: true
ttl:
  access_token: 5m
  id_token: 5m
  auth_code: 1m
  refresh_token: 24h
oidc:
  subject_identifiers:
    supported_types: [public]
log:
  level: error
  leak_sensitive_values: false
