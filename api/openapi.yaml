        '415':
          $ref: '#/components/responses/Problem'
        '428':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
      x-authorization: active_owner
  /v1/sessions:
    get:
      operationId: listMySessions
      summary: List central sessions of the current user
      description: Requires current User, MFA session and tenant-bound grant.
      tags:
      - Identity
      security:
      - OAuth2:
        - platform:read
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/After'
      responses:
        '200':
          description: List central sessions of the current user
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionPage'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '412':
          $ref: '#/components/responses/Problem'
        '413':
          $ref: '#/components/responses/Problem'
        '415':
          $ref: '#/components/responses/Problem'
        '428':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /v1/sessions/{session}/revoke:
    post:
      operationId: revokeMySession
      summary: Revoke one central session owned by the current user
      description: Recent MFA required. Revokes business authority before queued Hydra
        cleanup. Revoking the current session invalidates this access token. Session
        cookie digests, CSRF values, factor secrets and tokens are never returned.
      tags:
      - Identity
      security:
      - OAuth2:
        - platform:write
      parameters:
      - $ref: '#/components/parameters/sessionID'
      responses:
        '204':
          description: Revoke one central session owned by the current user
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '412':
          $ref: '#/components/responses/Problem'
        '413':
          $ref: '#/components/responses/Problem'
        '415':
          $ref: '#/components/responses/Problem'
        '428':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
      x-recent-mfa-seconds: 300
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Empty'
  /openapi.yaml:
    get:
      operationId: getOpenapiyaml
      summary: Read public API documentation
      security: []
      responses:
        '200':
          description: Public reference; no credentials
          content:
            application/yaml: {}
  /openapi.json:
    get:
      operationId: getOpenapijson
      summary: Read public API documentation
      security: []
      responses:
        '200':
          description: Public reference; no credentials
          content:
            application/json: {}
  /docs:
    get:
      operationId: getDocs
      summary: Read public API documentation
      security: []
      responses:
        '200':
          description: Public reference; no credentials
          content:
            text/html: {}
  /health/ready:
    get:
      operationId: getReadiness
      summary: Check the business schema
      security: []
      responses:
        '204':
          description: Business schema ready
        '503':
          $ref: '#/components/responses/Problem'
components:
  securitySchemes:
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: http://auth.localhost:4464/oauth2/auth
          tokenUrl: http://auth.localhost:4464/oauth2/token
          refreshUrl: http://auth.localhost:4464/oauth2/token
          scopes:
            platform:read: Read identity and authorized space metadata
            platform:write: Modify owned spaces and own sessions; recent MFA required
  schemas:
    Problem:
      type: object
      additionalProperties: false
      required:
      - type
      - title
      - status
      - code
      - request_id
      properties:
        type:
          type: string
          format: uri
        title: *id001
        status:
          type: integer
          minimum: 400
          maximum: 599
        code: *id001
        request_id: *id001
    Me:
      type: object
      additionalProperties: false
      required:
      - user_id
      - tenant_id
      - membership_id
      - session_id
      properties:
        user_id: &id002
          type: string
          pattern: ^[a-f0-9]{32}$
        tenant_id: *id002
        membership_id: *id002
        session_id: *id002
    Tenant:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - slug
      - membership_id
      - owner
      - authz_version
      - org_version
      - root_id
      properties:
        id: *id002
        name: *id001
        slug:
          type: string
          pattern: ^[a-z0-9][a-z0-9-]{0,62}$
        membership_id: *id002
        owner:
          type: boolean
        authz_version: &id003
          type: integer
          minimum: 1
        org_version: *id003
        root_id: *id002
    TenantInput:
      type: object
      additionalProperties: false
      required:
      - slug
      - name
      properties:
        slug:
          type: string
          pattern: ^[a-z0-9][a-z0-9-]{0,62}$
        name:
          type: string
          minLength: 1
          maxLength: 128
          description: Nonblank, trimmed, at most 128 UTF-8 bytes.
    TenantCreated:
      type: object
      additionalProperties: false
      required:
      - id
      - membership_id
      - root_id
      properties:
        id: *id002
        membership_id: *id002
        root_id: *id002
    Member:
      type: object
      additionalProperties: false
      required:
      - id
      - user_id
      - email
      - status
      - owner
      properties:
        id: *id002
        user_id: *id002
        email:
          type:
          - string
          - 'null'
          format: email
          description: Verified alias visible only to authorized tenant owners.
        status:
          enum:
          - active
          - invited
          - suspended
          - left
        owner:
          type: boolean
    Organization:
      type: object
      additionalProperties: false
      required:
      - id
      - parent_id
      - name
      properties:
        id: *id002
        parent_id: &id004
          type:
          - string
          - 'null'
          pattern: ^[a-f0-9]{32}$
        name: *id001
    OrganizationInput:
      type: object
      additionalProperties: false
      required:
      - parent_id
      - name
      properties:
        parent_id: *id002
        name:
          type: string
          minLength: 1
          maxLength: 128
          description: Nonblank, trimmed, at most 128 UTF-8 bytes.
    OrganizationCreated:
      type: object
      additionalProperties: false
      required:
      - id
      - org_version
      properties:
        id: *id002
        org_version: *id003
    MoveInput:
      type: object
      additionalProperties: false
      required:
      - parent_id
      - dry_run
      properties:
        parent_id: *id002
        dry_run:
          type: boolean
          description: Required; false executes the move and invalidates old tenant
            grants.
    MoveResult:
      type: object
      additionalProperties: false
      required:
      - subtree_nodes
      - resulting_depth
      - org_version
      - dry_run
      properties:
        subtree_nodes:
          type: integer
          minimum: 1
        resulting_depth:
          type: integer
          minimum: 0
          maximum: 16
        org_version: *id003
        dry_run:
          type: boolean
    Invitation:
      type: object
      additionalProperties: false
      required:
      - id
      - email
      - expires_at
      - state
      properties:
        id: *id002
        email:
          type: string
          format: email
        expires_at:
          type: integer
        state:
          enum:
          - pending
          - expired
          - closed
          description: Closed covers accepted or revoked; audit events distinguish
            the transition.
    InvitationInput:
      type: object
      additionalProperties: false
      required:
      - email
      properties:
        email:
          type: string
          format: email
          maxLength: 254
    InvitationCreated:
      type: object
      additionalProperties: false
      required:
      - id
      - token
      - expires_in
      properties:
        id: *id002
        token:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
          readOnly: true
          description: One-time bearer invitation returned only here; keep out of
            logs. No automatic email transport.
        expires_in:
          type: integer
          const: 86400
    InvitationProof:
      type: object
      additionalProperties: false
      required:
      - token
      properties:
        token:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
          writeOnly: true
    MembershipCreated:
      type: object
      additionalProperties: false
      required:
      - membership_id
      properties:
        membership_id: *id002
    AuditEvent:
      type: object
      additionalProperties: false
      required:
      - id
      - actor_membership_id
      - action
      - target_id
      - occurred_at
      properties:
        id: *id002
        actor_membership_id: *id002
        action: *id001
        target_id: *id002
        occurred_at:
          type: string
          format: date-time
    Session:
      type: object
      additionalProperties: false
      required:
      - id
      - current
      - active
      - authenticated_at
      - second_factor
      - idle_expires_at
      - absolute_expires_at
      properties:
        id: *id002
        current:
          type: boolean
        active:
          type: boolean
        authenticated_at:
          type: integer
        second_factor:
          enum:
          - otp
          - recovery
        idle_expires_at:
          type: integer
        absolute_expires_at:
          type: integer
    Empty:
      type: object
      additionalProperties: false
      required: []
      properties: {}
    TenantPage:
      type: object
      additionalProperties: false
      required:
      - items
      - next_cursor
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/Tenant'
        next_cursor: *id004
    MemberPage:
      type: object
      additionalProperties: false
      required:
      - items
      - next_cursor
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/Member'
        next_cursor: *id004
    OrganizationPage:
      type: object
      additionalProperties: false
      required:
      - items
      - next_cursor
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/Organization'
        next_cursor: *id004
    InvitationPage:
      type: object
      additionalProperties: false
      required:
      - items
      - next_cursor
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/Invitation'
        next_cursor: *id004
    AuditEventPage:
      type: object
      additionalProperties: false
      required:
      - items
      - next_cursor
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/AuditEvent'
        next_cursor: *id004
    SessionPage:
      type: object
      additionalProperties: false
      required:
      - items
      - next_cursor
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/Session'
        next_cursor: *id004
  parameters:
    TenantID:
      in: path
      name: tenant
      required: true
      description: Must equal the access token tenant; another tenant returns 404,
        even if the user also belongs to it.
      schema: *id002
    Limit:
      in: query
      name: limit
      description: Bounded keyset page size.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    After:
      in: query
      name: after
      description: Previous next_cursor; ascending UUID keyset, not a snapshot or
        timestamp ordering guarantee.
      schema: *id002
    AuthzMatch:
      in: header
      name: If-Match
      required: true
      description: 'Latest tenant/members ETag. Missing: 428; stale: 412.'
      schema:
        type: string
        pattern: ^"authz-[1-9][0-9]*"$
    OrgMatch:
      in: header
      name: If-Match
      required: true
      description: 'Latest organizations ETag. Missing: 428; stale: 412.'
      schema:
        type: string
        pattern: ^"org-[1-9][0-9]*"$
    memberID:
      in: path
      name: member
      required: true
      schema: *id002
    orgID:
      in: path
      name: org
      required: true
      schema: *id002
    invitationID:
      in: path
      name: invitation
      required: true
      schema: *id002
    sessionID:
      in: path
      name: session
      required: true
      schema: *id002
  responses:
    Problem:
      description: RFC 9457 problem. Fixed code only; no input, token or SQL echoed.
        Codes include invalid_token, forbidden, insufficient_scope, recent_mfa_required,
        tenant_mismatch, invalid_request, not_found, already_exists, last_active_owner,
        root_cannot_move, organization_cycle, version_conflict, precondition_required,
        invalid_precondition, rate_limited, temporarily_unavailable.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        WWW-Authenticate:
          $ref: '#/components/headers/Authenticate'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  headers:
    RequestID:
      description: Server-generated request correlation ID.
      schema: *id001
    ETag:
      description: Quoted collection version for If-Match.
      schema: *id001
    Authenticate:
      description: Bearer challenge, including invalid_token or insufficient_scope.
      schema: *id001
    RetryAfter:
      description: Seconds before retrying.
      schema:
        type: integer
