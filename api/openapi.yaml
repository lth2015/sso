          pattern: ^[a-z0-9][a-z0-9-]{0,62}$
        membership_id: *id003
        owner:
          type: boolean
        authz_version: &id004
          type: integer
          minimum: 1
        org_version: *id004
        root_id: *id003
    TenantInput:
      type: object
      additionalProperties: false
      required:
      - slug
      - name
      properties:
        slug:
          type: string
          pattern: ^[a-z0-9][a-z0-9-]{0,62}$
        name:
          type: string
          minLength: 1
          maxLength: 128
          description: Nonblank, trimmed, at most 128 UTF-8 bytes.
    TenantCreated:
      type: object
      additionalProperties: false
      required:
      - id
      - membership_id
      - root_id
      properties:
        id: *id003
        membership_id: *id003
        root_id: *id003
    Member:
