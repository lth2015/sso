  /v1/tenants/{tenant}/applications/{application}/user-access/history:
    get:
      operationId: listApplicationAccessHistory
      summary: Read captured application User admission changes
      description: Current User/platform:read and current owner only, including aged
        MFA; app must be owned by the token tenant, shared associations return application_unmanaged.
        Current disabled application/member state does not rewrite captured history.
        Fixed event/actor/optional target member IDs, action, time, historical mode
        and lossless positive signed-int64 revision; no emails, secrets or raw audit
        payload. Mode changes have null membership_id; grants/revokes have a member
        ID. Uses existing atomic context/audit rows, not a reconstruction or permission
        restore. Unknown or cross-linked metadata returns no partial page. Limit 1-100/default
        50, ascending event IDs; after must belong to this tenant/app captured history,
        explicit zero/unknown/foreign cursor is 404. No empty/duplicate/unknown queries
        or GET body. No HTTP ETag, snapshot, signature/WORM or archive guarantee;
        ordinary audit.read does not grant this access. Frozen audit exports and SDK
        types remain unchanged.
      tags:
      - Tenant management
      security:
      - OAuth2:
        - platform:read
      parameters:
      - $ref: '#/components/parameters/TenantID'
      - $ref: '#/components/parameters/applicationID'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/After'
      responses:
