    get:
      operationId: getReadiness
      summary: Check the business schema
      security: []
      responses:
        '204':
          description: Business schema ready
        '503':
          $ref: '#/components/responses/Problem'
components:
  securitySchemes:
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: http://auth.localhost:4464/oauth2/auth
          tokenUrl: http://auth.localhost:4464/oauth2/token
          refreshUrl: http://auth.localhost:4464/oauth2/token
          scopes:
            platform:read: Read identity and authorized space metadata
            platform:write: Modify authorized space resources and own sessions; recent
              MFA required
  schemas:
    Problem:
      type: object
      additionalProperties: false
      required:
      - type
      - title
      - status
      - code
      - request_id
      properties:
        type:
          type: string
          format: uri
        title: *id002
        status:
          type: integer
          minimum: 400
          maximum: 599
        code: *id002
        request_id: *id002
    Me:
