    AuditBatch:
      oneOf:
      - $ref: '#/components/schemas/ManagementAuditBatch'
      - $ref: '#/components/schemas/MachineAuditBatch'
    PublicClientProtocolObservation:
      type: object
      additionalProperties: false
      required:
      - resource_kind
      - tenant_id
      - application_id
      - service_principal_id
      - resource_id
      - revision
      - resource_etag
      - local_state
      - profile_state
      - differences
      - observed_at
      - authority_checked_at
      properties:
        resource_kind:
          const: public_client
        tenant_id: *id003
        application_id: *id003
        service_principal_id:
          type: 'null'
        resource_id: *id003
        revision: *id004
        resource_etag:
          type: string
          pattern: ^"client-[a-f0-9]{32}-[a-f0-9]{32}-[1-9][0-9]*"$
          description: Current local resource write precondition, not an HTTP validator
            for this time-varying observation.
        local_state:
          enum:
          - pending
          - active
          - revoked
        profile_state:
          enum:
          - matching
          - absent
          - conflict
        differences:
          type: array
          maxItems: 9
          uniqueItems: true
          items:
            enum: &id010
            - client_id
            - client_name
            - token_endpoint_auth_method
            - redirect_uris
            - grant_types
            - response_types
            - scope
            - audience
            - metadata
        observed_at:
          type: string
          format: date-time
        authority_checked_at:
          type: string
          format: date-time
      allOf:
      - if:
          properties:
            profile_state:
              const: conflict
        then:
          properties:
            differences:
              minItems: 1
        else:
          properties:
            differences:
              maxItems: 0
    MachineCredentialProtocolObservation:
      type: object
      additionalProperties: false
      required:
      - resource_kind
      - tenant_id
      - application_id
      - service_principal_id
      - resource_id
      - revision
      - resource_etag
      - local_state
      - profile_state
      - differences
      - observed_at
      - authority_checked_at
      properties:
        resource_kind:
          const: machine_credential
        tenant_id: *id003
        application_id: *id003
        service_principal_id: *id003
        resource_id: *id003
        revision: *id004
        resource_etag:
          type: string
          pattern: ^"cred-[a-f0-9]{32}-[a-f0-9]{32}-[1-9][0-9]*"$
          description: Current local resource write precondition, not an HTTP validator
            for this time-varying observation.
        local_state:
          enum:
          - pending
          - active
          - revoked
          - expired
        profile_state:
          enum:
          - matching
          - absent
          - conflict
        differences:
          type: array
          maxItems: 9
          uniqueItems: true
          items:
            enum: *id010
        observed_at:
          type: string
          format: date-time
        authority_checked_at:
          type: string
          format: date-time
      allOf:
      - if:
          properties:
            profile_state:
              const: conflict
        then:
          properties:
            differences:
              minItems: 1
        else:
          properties:
            differences:
              maxItems: 0
    ApplicationUserAccessPolicy:
      type: object
      additionalProperties: false
      required:
      - tenant_id
      - application_id
      - mode
      - version
      properties:
        tenant_id: *id003
        application_id: *id003
        mode: &id011
          enum:
          - all_members
          - selected_members
        version: &id012
          type: string
          pattern: ^[1-9][0-9]{0,18}$
          description: Positive signed-int64 decimal revision, transported losslessly
            as a string.
    ApplicationUserAccessPage:
      type: object
      additionalProperties: false
      required:
      - policy
      - items
      - next_cursor
      properties:
        policy:
          $ref: '#/components/schemas/ApplicationUserAccessPolicy'
        items:
          type: array
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required:
            - membership_id
            properties:
              membership_id: *id003
        next_cursor: *id005
    ApplicationUserAccessInput:
      type: object
      additionalProperties: false
      required:
      - mode
      properties:
        mode: *id011
    ApplicationUserAccessDecision:
      type: object
      additionalProperties: false
      required:
      - policy
      - membership_id
      - allowed
      - explicit_grant
      - reason
      properties:
        policy:
          $ref: '#/components/schemas/ApplicationUserAccessPolicy'
        membership_id: *id003
        allowed:
          type: boolean
        explicit_grant:
          type: boolean
        reason:
          enum:
          - owner
          - all_members
          - explicit_grant
          - not_granted
          - user_inactive
          - membership_inactive
          - application_disabled
    ApplicationAccessHistoryEntry:
      type: object
      additionalProperties: false
      required:
      - id
      - actor_membership_id
      - membership_id
      - action
      - occurred_at
      - mode
      - version
      properties:
        id: *id003
        actor_membership_id: *id003
        membership_id: *id005
        action:
          enum:
          - application.user_access.mode_changed
          - application.user_access.granted
          - application.user_access.revoked
        occurred_at:
          type: string
          format: date-time
        mode: *id011
        version: *id012
    ApplicationAccessHistoryPage:
      type: object
      additionalProperties: false
      required:
      - format
      - tenant_id
      - application_id
      - items
      - next_cursor
      properties:
        format:
          const: sso.application.user-access-history.v1
        tenant_id: *id003
        application_id: *id003
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/ApplicationAccessHistoryEntry'
        next_cursor: *id005
  parameters:
    PrincipalMatch:
      in: header
      name: If-Match
      required: true
      description: Exact principal detail version bound to tenant/principal.
      schema:
        type: string
        pattern: ^"sp-[a-f0-9]{32}-[a-f0-9]{32}-[1-9][0-9]*"$
    InvitationMatch:
      in: header
      name: If-Match
      required: true
      description: Exact current invitation detail revision, bound to tenant and invitation.
        Missing 428, malformed 400, stale/other resource 412. Acceptance, revocation
        and reissue invalidate earlier revisions.
      schema:
        type: string
        pattern: ^"invite-[a-f0-9]{32}-[a-f0-9]{32}-[1-9][0-9]*"$
    CredentialMatch:
      in: header
      name: If-Match
      required: true
      description: Exact credential detail API revision, including overlap expiry
        changes. It is distinct from the private JWT security version.
      schema:
        type: string
        pattern: ^"cred-[a-f0-9]{32}-[a-f0-9]{32}-[1-9][0-9]*"$
    ClientMatch:
      in: header
      name: If-Match
      required: true
      description: Exact managed-client detail ETag bound to tenant/client/version.
        Missing 428, malformed 400, stale/other resource 412.
      schema:
        type: string
        pattern: ^"client-[a-f0-9]{32}-[a-f0-9]{32}-[1-9][0-9]*"$
    TenantID:
      in: path
      name: tenant
      required: true
      description: Must equal the access token tenant; another tenant returns 404,
        even if the user also belongs to it.
      schema: *id003
    Limit:
      in: query
      name: limit
      description: Bounded keyset page size.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    After:
      in: query
      name: after
      description: Previous next_cursor; ascending UUID keyset, not a snapshot or
        timestamp ordering guarantee.
      schema: *id003
    ApplicationMatch:
      in: header
      name: If-Match
      required: true
      description: 'Exact application detail ETag, bound to tenant/application/version.
        Missing: 428; wrong resource or stale: 412.'
      schema:
        type: string
        pattern: ^"app-[a-f0-9]{32}-[a-f0-9]{32}-[1-9][0-9]*"$
    ClientAfter:
      in: query
      name: after
      description: Previous client page next_cursor. Ascending printable client_id,
        not a UUID or pagination snapshot. URL-encode it.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: ^[!-~]{1,128}$
    AuthzMatch:
      in: header
      name: If-Match
      required: true
      description: 'Latest tenant/members ETag. Missing: 428; stale: 412.'
      schema:
        type: string
        pattern: ^"authz-[1-9][0-9]*"$
    OrgMatch:
      in: header
      name: If-Match
      required: true
      description: 'Latest organizations ETag. Missing: 428; stale: 412.'
      schema:
        type: string
        pattern: ^"org-[1-9][0-9]*"$
    memberID:
      in: path
      name: member
      required: true
      schema: *id003
    orgID:
      in: path
      name: org
      required: true
      schema: *id003
    invitationID:
      in: path
      name: invitation
      required: true
      schema: *id003
    sessionID:
      in: path
      name: session
      required: true
      schema: *id003
    roleID:
      in: path
      name: role
      required: true
      schema: *id003
    applicationID:
      in: path
      name: application
      required: true
      schema: *id003
    clientID:
      in: path
      name: client
      required: true
      schema: *id003
    principalID:
      in: path
      name: principal
      required: true
      schema: *id003
    credentialID:
      in: path
      name: credential
      required: true
      schema: *id003
    UserAccessMatch:
      in: header
      name: If-Match
      required: true
      description: Exact User admission policy ETag bound to tenant/application/revision;
        not application enablement or tenant authz version. Missing 428, wrong namespace/stale
        412.
      schema:
        type: string
        pattern: ^"ua-[a-f0-9]{32}-[a-f0-9]{32}-[1-9][0-9]*"$
  responses:
    Problem:
      description: RFC 9457 problem. Fixed code only; no input, token or SQL echoed.
        Codes include credential_limit, invalid_credential_state, service_principal_disabled,
        application_unmanaged, observation_changed, invalid_client_state, invalid_invitation_state,
        protocol_client_conflict, protected_organization, organization_not_empty,
        protected_application, application_unavailable, invalid_token, forbidden,
        insufficient_scope, recent_mfa_required, tenant_mismatch, invalid_request,
        not_found, already_exists, reserved_role, role_in_use, last_active_owner,
        root_cannot_move, organization_cycle, version_conflict, precondition_required,
        invalid_precondition, rate_limited, temporarily_unavailable.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        WWW-Authenticate:
          $ref: '#/components/headers/Authenticate'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  headers:
    RequestID:
      description: Server-generated request correlation ID.
      schema: *id002
    ETag:
      description: Quoted resource or collection version for If-Match.
      schema: *id002
    Authenticate:
      description: Bearer challenge, including invalid_token or insufficient_scope.
      schema: *id002
    RetryAfter:
      description: Seconds before retrying.
      schema:
        type: integer
