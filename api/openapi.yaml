              $ref: '#/components/headers/RequestID'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationCreated'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '412':
          $ref: '#/components/responses/Problem'
        '413':
          $ref: '#/components/responses/Problem'
        '415':
          $ref: '#/components/responses/Problem'
        '428':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
      x-authorization: permission:organizations.write
      x-recent-mfa-seconds: 300
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationInput'
            example:
              parent_id: '00000000000000000000000000000000'
              name: 示例组织
  /v1/tenants/{tenant}/organizations/{org}/move:
    post:
      operationId: moveOrganization
      summary: Preview or execute an organization move
      description: Requires organizations.write on the token tenant. Explicit deny
        overrides other allows, including owner operational privileges. Recent MFA
        required, including preview. Root/cycle/depth checks apply. Preview changes
        no state. Executing changes organization and tenant authorization versions;
        obtain a new authorization afterwards.
      tags:
      - Tenant management
      security:
      - OAuth2:
        - platform:write
      parameters:
      - $ref: '#/components/parameters/TenantID'
      - $ref: '#/components/parameters/orgID'
      - $ref: '#/components/parameters/OrgMatch'
      responses:
        '200':
          description: Preview or execute an organization move
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoveResult'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '412':
          $ref: '#/components/responses/Problem'
        '413':
          $ref: '#/components/responses/Problem'
        '415':
          $ref: '#/components/responses/Problem'
        '428':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '503':
