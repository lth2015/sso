      operationId: acceptInvitation
      summary: Consume an invitation for the verified user
      description: Recent MFA required. The proof selects the destination tenant.
        Verified email must match; membership only, no implicit role. Consumed/expired/revoked
        proofs are invalid. Acceptance increments destination tenant authorization
        version.
      tags:
      - Identity
      security:
      - OAuth2:
        - platform:write
      parameters: []
      responses:
        '201':
          description: Consume an invitation for the verified user
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipCreated'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '412':
          $ref: '#/components/responses/Problem'
        '413':
          $ref: '#/components/responses/Problem'
        '415':
          $ref: '#/components/responses/Problem'
        '428':
