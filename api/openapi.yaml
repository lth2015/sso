        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoveInput'
            example:
              parent_id: '00000000000000000000000000000000'
              dry_run: true
  /v1/tenants/{tenant}/organizations/{org}/members/{member}:
