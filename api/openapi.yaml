components:
  securitySchemes:
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: http://auth.localhost:4464/oauth2/auth
          tokenUrl: http://auth.localhost:4464/oauth2/token
          refreshUrl: http://auth.localhost:4464/oauth2/token
          scopes:
            platform:read: Read identity and authorized space metadata
            platform:write: Modify authorized space resources and own sessions; recent
              MFA required
  schemas:
    Problem:
      type: object
      additionalProperties: false
      required:
      - type
      - title
      - status
      - code
      - request_id
      properties:
        type:
          type: string
          format: uri
        title: *id002
        status:
          type: integer
          minimum: 400
          maximum: 599
        code: *id002
        request_id: *id002
    Me:
      type: object
      additionalProperties: false
      required:
      - user_id
      - tenant_id
      - membership_id
      - session_id
      properties:
        user_id: &id003
          type: string
          pattern: ^[a-f0-9]{32}$
        tenant_id: *id003
        membership_id: *id003
        session_id: *id003
    Tenant:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - slug
      - membership_id
      - owner
      - authz_version
      - org_version
      - root_id
      properties:
        id: *id003
        name: *id002
        slug:
          type: string
          pattern: ^[a-z0-9][a-z0-9-]{0,62}$
        membership_id: *id003
        owner:
          type: boolean
        authz_version: &id004
          type: integer
          minimum: 1
        org_version: *id004
        root_id: *id003
    TenantInput:
      type: object
      additionalProperties: false
      required:
      - slug
      - name
      properties:
        slug:
          type: string
          pattern: ^[a-z0-9][a-z0-9-]{0,62}$
        name:
          type: string
          minLength: 1
          maxLength: 128
          description: Nonblank, trimmed, at most 128 UTF-8 bytes.
    TenantCreated:
      type: object
      additionalProperties: false
      required:
      - id
      - membership_id
      - root_id
      properties:
        id: *id003
        membership_id: *id003
        root_id: *id003
    Member:
      type: object
      additionalProperties: false
      required:
      - id
      - user_id
      - email
      - status
      - owner
      properties:
        id: *id003
        user_id: *id003
        email:
          type:
          - string
          - 'null'
          format: email
          description: Verified alias requires members.read on the token tenant.
        status:
          enum:
          - active
          - invited
          - suspended
          - left
        owner:
          type: boolean
    Organization:
      type: object
      additionalProperties: false
      required:
      - id
      - parent_id
      - name
      properties:
        id: *id003
        parent_id: &id005
          type:
          - string
          - 'null'
          pattern: ^[a-f0-9]{32}$
        name: *id002
    OrganizationInput:
      type: object
      additionalProperties: false
      required:
      - parent_id
      - name
      properties:
        parent_id: *id003
        name:
          type: string
          minLength: 1
          maxLength: 128
          description: Nonblank, trimmed, at most 128 UTF-8 bytes.
    OrganizationCreated:
      type: object
      additionalProperties: false
      required:
      - id
      - org_version
      properties:
        id: *id003
        org_version: *id004
    MoveInput:
      type: object
      additionalProperties: false
      required:
      - parent_id
      - dry_run
      properties:
        parent_id: *id003
        dry_run:
          type: boolean
          description: Required; false executes the move and invalidates old tenant
            grants.
    MoveResult:
      type: object
      additionalProperties: false
      required:
      - subtree_nodes
      - resulting_depth
      - org_version
      - dry_run
      properties:
        subtree_nodes:
          type: integer
          minimum: 1
        resulting_depth:
          type: integer
          minimum: 0
          maximum: 16
        org_version: *id004
        dry_run:
          type: boolean
    Invitation:
      type: object
      additionalProperties: false
      required:
      - id
      - email
      - expires_at
      - state
      properties:
        id: *id003
        email:
          type: string
          format: email
        expires_at:
          type: integer
        state:
          enum:
          - pending
          - expired
          - closed
          description: Closed covers accepted or revoked; audit events distinguish
            the transition.
    InvitationInput:
      type: object
      additionalProperties: false
      required:
      - email
      properties:
        email:
          type: string
          format: email
          maxLength: 254
    InvitationCreated:
      type: object
      additionalProperties: false
      required:
      - id
      - token
      - expires_in
      properties:
        id: *id003
        token:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
          readOnly: true
          description: One-time bearer invitation returned only here; keep out of
            logs. No automatic email transport.
        expires_in:
          type: integer
          const: 86400
    InvitationProof:
      type: object
      additionalProperties: false
      required:
      - token
      properties:
        token:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
          writeOnly: true
    MembershipCreated:
      type: object
      additionalProperties: false
      required:
      - membership_id
      properties:
        membership_id: *id003
    AuditEvent:
      type: object
      additionalProperties: false
      required:
      - id
      - actor_membership_id
      - action
      - target_id
      - occurred_at
      properties:
        id: *id003
        actor_membership_id: *id003
        action: *id002
        target_id: *id003
        occurred_at:
          type: string
          format: date-time
        role_id: *id003
        membership_id: *id003
        role_code: *id002
    Session:
      type: object
      additionalProperties: false
      required:
      - id
      - current
      - active
      - authenticated_at
      - second_factor
      - idle_expires_at
      - absolute_expires_at
      properties:
        id: *id003
        current:
          type: boolean
        active:
          type: boolean
        authenticated_at:
          type: integer
        second_factor:
          enum:
          - otp
          - recovery
        idle_expires_at:
          type: integer
        absolute_expires_at:
          type: integer
    Empty:
      type: object
      additionalProperties: false
      required: []
      properties: {}
    TenantPage:
      type: object
      additionalProperties: false
      required:
      - items
      - next_cursor
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/Tenant'
        next_cursor: *id005
    MemberPage:
      type: object
      additionalProperties: false
      required:
      - items
      - next_cursor
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/Member'
        next_cursor: *id005
    OrganizationPage:
      type: object
      additionalProperties: false
      required:
      - items
      - next_cursor
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/Organization'
        next_cursor: *id005
    InvitationPage:
      type: object
      additionalProperties: false
      required:
      - items
      - next_cursor
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/Invitation'
        next_cursor: *id005
    AuditEventPage:
      type: object
      additionalProperties: false
      required:
      - items
      - next_cursor
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/AuditEvent'
        next_cursor: *id005
    SessionPage:
      type: object
      additionalProperties: false
      required:
      - items
      - next_cursor
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/Session'
        next_cursor: *id005
    RolePolicy:
      type: object
      additionalProperties: false
      required:
      - permission
      - effect
      properties:
        permission:
          enum: &id007
          - audit.read
          - invitations.manage
          - members.read
          - members.write
          - organizations.read
          - organizations.write
        effect:
          enum:
          - allow
          - deny
    RoleInput:
      type: object
      additionalProperties: false
      required:
      - code
      - policies
      properties:
        code:
          type: string
          pattern: ^[a-z][a-z0-9_-]{0,62}$
          not:
            const: owner
        policies: &id006
          type: array
          maxItems: 12
          uniqueItems: true
          items:
            $ref: '#/components/schemas/RolePolicy'
    RoleUpdate:
      type: object
      additionalProperties: false
      required:
      - policies
      properties:
        policies: *id006
    Role:
      type: object
      additionalProperties: false
      required:
      - id
      - code
      - built_in
      - scope
      - policies
      - binding_count
      properties:
        id: *id003
        code: *id002
        built_in:
          type: boolean
        scope:
          const: tenant
        policies:
          type: array
          items:
            $ref: '#/components/schemas/RolePolicy'
        binding_count:
          type: integer
          minimum: 0
    RolePage:
      type: object
      additionalProperties: false
      required:
      - items
      - next_cursor
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/Role'
        next_cursor: *id005
    RoleCreated:
      type: object
      additionalProperties: false
      required:
      - id
      - authz_version
      properties:
        id: *id003
        authz_version: *id004
    MemberRoles:
      type: object
      additionalProperties: false
      required:
      - items
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/Role'
    PermissionSnapshot:
      type: object
      additionalProperties: false
      required:
      - permissions
      - denied
      - owner
      - authz_version
      - catalog
      properties:
        permissions:
          type: array
          uniqueItems: true
          items:
            enum:
            - audit.read
            - invitations.manage
            - members.read
            - members.write
            - organizations.read
            - organizations.write
            - roles.manage
        denied:
          type: array
          uniqueItems: true
          items:
            enum: *id007
        owner:
          type: boolean
        authz_version: *id004
        catalog:
          type: array
          items:
            enum: *id007
    SecuritySummary:
      type: object
      additionalProperties: false
      required:
      - mfa_enabled
      - recovery_codes_remaining
      - active_sessions
      - authenticated_at
      - second_factor
      properties:
        mfa_enabled:
          type: boolean
        recovery_codes_remaining:
          type: integer
          minimum: 0
          maximum: 10
        active_sessions:
          type: integer
          minimum: 0
        authenticated_at:
          type: integer
        second_factor:
          enum:
          - otp
          - recovery
    SessionsRevoked:
      type: object
      additionalProperties: false
      required:
      - revoked_sessions
      properties:
        revoked_sessions:
          type: integer
          minimum: 0
  parameters:
    TenantID:
      in: path
      name: tenant
      required: true
      description: Must equal the access token tenant; another tenant returns 404,
        even if the user also belongs to it.
      schema: *id003
    Limit:
      in: query
      name: limit
      description: Bounded keyset page size.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    After:
      in: query
      name: after
      description: Previous next_cursor; ascending UUID keyset, not a snapshot or
        timestamp ordering guarantee.
      schema: *id003
    AuthzMatch:
      in: header
      name: If-Match
      required: true
      description: 'Latest tenant/members ETag. Missing: 428; stale: 412.'
      schema:
        type: string
        pattern: ^"authz-[1-9][0-9]*"$
    OrgMatch:
      in: header
      name: If-Match
      required: true
      description: 'Latest organizations ETag. Missing: 428; stale: 412.'
      schema:
        type: string
        pattern: ^"org-[1-9][0-9]*"$
    memberID:
      in: path
      name: member
      required: true
      schema: *id003
    orgID:
      in: path
      name: org
      required: true
      schema: *id003
    invitationID:
      in: path
      name: invitation
      required: true
      schema: *id003
    sessionID:
      in: path
      name: session
      required: true
      schema: *id003
    roleID:
      in: path
      name: role
      required: true
      schema: *id003
  responses:
    Problem:
      description: RFC 9457 problem. Fixed code only; no input, token or SQL echoed.
        Codes include invalid_token, forbidden, insufficient_scope, recent_mfa_required,
        tenant_mismatch, invalid_request, not_found, already_exists, reserved_role,
        role_in_use, last_active_owner, root_cannot_move, organization_cycle, version_conflict,
        precondition_required, invalid_precondition, rate_limited, temporarily_unavailable.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        WWW-Authenticate:
          $ref: '#/components/headers/Authenticate'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  headers:
    RequestID:
      description: Server-generated request correlation ID.
      schema: *id002
    ETag:
      description: Quoted collection version for If-Match.
      schema: *id002
    Authenticate:
      description: Bearer challenge, including invalid_token or insufficient_scope.
      schema: *id002
    RetryAfter:
      description: Seconds before retrying.
      schema:
        type: integer
