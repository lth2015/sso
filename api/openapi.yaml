  /v1/tenants/{tenant}/applications/{application}/clients/{client}/protocol-status:
    get:
      operationId: inspectManagedClientProtocol
      summary: Observe reviewed protocol fields for an owned public client
      description: Active owner/User platform:read only. Current primary authority
        and resource ownership are checked before and after a fixed private Admin
        GET; no tenant lock spans the RPC. Local revision changes return 409 observation_changed;
        lost authority/expiry refuses the response. Bounded four-second total context
        and three-second Admin timeout, no redirects or caller destination. matching
        means only the nine reviewed non-secret fields agree, not login readiness
        or a complete engine health proof. absent/conflict do not create, activate,
        revoke, delete or adopt anything. Pending stays pending. Only controlled difference
        field names, local revision/state, namespace and distinct observation/authority-check
        times and resource_etag (the local resource write precondition, not an observation
        HTTP validator) are returned; no actual differing values, Admin body, secret/hash/registration
        token. No GET body/query, audit/outbox/authority mutation or automatic retry;
        dependency failure 503. Existing explicit reconcile/revoke retain MFA/ETag
        requirements.
      tags:
      - Tenant management
      security:
      - OAuth2:
        - platform:read
      parameters:
      - $ref: '#/components/parameters/TenantID'
      - $ref: '#/components/parameters/applicationID'
      - $ref: '#/components/parameters/clientID'
      responses:
        '200':
          description: Observe reviewed protocol fields for an owned public client
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicClientProtocolObservation'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '412':
          $ref: '#/components/responses/Problem'
        '413':
          $ref: '#/components/responses/Problem'
        '415':
          $ref: '#/components/responses/Problem'
        '428':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
      x-authorization: reserved_owner:roles.manage
  /v1/tenants/{tenant}/applications/{application}/service-principals/{principal}/credentials/{credential}/protocol-status:
    get:
      operationId: inspectMachineCredentialProtocol
      summary: Observe reviewed protocol fields for an owned machine credential
      description: 'Active owner/User platform:read only, including disabled app/SP
        and revoked/expired credential metadata. Private GET only, primary authority/resource
        rechecked afterward; RPC does not hold a tenant lock. Revision/profile changes
        return 409 observation_changed. Matching covers reviewed non-secret fields,
        never verifies or recovers SK or proves JWT/consumer readiness. Pending/unknown/lost
        SK cannot be activated or recovered here; revoke/cleanup/recreate remains
        explicit. Absent remote registration does not itself change local active state
        or revoke an issued JWT: use local revoke for authority changes. Returns only
        fixed namespace/revision/state/time and enumerated difference names; no AK/secret/hash/Admin
        values. Bounded deadlines, no request body/query, protocol/local writes, audit/outbox
        mutation, caller destination or automatic repair. Dependency failure 503;
        same User/tenant/owner bounds as credential metadata.'
      tags:
      - Tenant management
      security:
      - OAuth2:
        - platform:read
      parameters:
      - $ref: '#/components/parameters/TenantID'
      - $ref: '#/components/parameters/applicationID'
      - $ref: '#/components/parameters/principalID'
      - $ref: '#/components/parameters/credentialID'
      responses:
