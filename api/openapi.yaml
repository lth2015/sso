    get:
      operationId: exportAuditBatch
      summary: Read one bounded audit export batch
      description: 'Requires audit.read on the token tenant. Explicit deny overrides
        other allows, including owner operational privileges. User platform:read and
        current audit.read, including delegated auditors. Kind management (default)
        or machine; 1–100 rows, default 50. Reads current primary authority and data
        in one transaction; no recent-MFA requirement beyond the valid User grant/session.
        Cursor must exist in this tenant and kind; unknown/foreign/cross-kind cursor
        is 404. Frozen sso.audit.batch.v1 projection: IDs, controlled action/time
        and optional role-binding snapshot; no raw request, email, token/proof/secret
        or creator-as-machine-actor. Empty items is [], next_cursor is null or the
        last included ID when more rows exist. No query/body tenant override or request
        body. No mutation/audit of the GET itself. Individual batches describe their
        own primary read time/authorization version; multiple batches are not a frozen
        global snapshot or signed archival proof. Browser downloads reread authority
        instead of saving a stale preview.'
      tags:
      - Tenant management
      security:
      - OAuth2:
        - platform:read
      parameters:
      - $ref: '#/components/parameters/TenantID'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/After'
      - in: query
        name: kind
        description: Separate management or machine audit source; cursor cannot cross
          kinds.
        schema:
          enum:
