openapi: 3.1.0
info:
  title: SSO Public Platform API
  version: 0.5.0
  description: External server/native-client contract. Local reference server only;
    production requires TLS and configured public origins. OAuth code+S256 PKCE, platform
    audience https://api.sso.local. No cookie authentication or wildcard CORS; browser
    integrations use a BFF. All writes require MFA authenticated within 300 seconds;
    refresh does not update auth_time. Active owners manage tenant resources; this
    slice does not implement arbitrary scoped RBAC. Authorization is checked against
    the business primary inside each operation transaction. Tenant-version mutations
    invalidate prior tenant grants, requiring new authorization. JSON objects reject
    duplicates, unknown fields, nested objects/arrays, invalid UTF-8 and extra documents.
    Request body limit 4096 bytes. UUIDs are lowercase 32-hex strings. List limit
    1–100, default 50; after is previous next_cursor. No pagination snapshot guarantee.
    Error format follows RFC 9457. All responses no-store. Invitation proofs never
    appear in lists/audit.
servers:
- url: http://api.localhost:8083
  description: Local acceptance only; SRE owns production deployment
tags:
- name: Identity
- name: Tenant management
paths:
