        tenant_id: *id003
        membership_id: *id003
        session_id: *id003
    Tenant:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - slug
      - membership_id
      - owner
      - authz_version
      - org_version
      - root_id
      properties:
