      summary: Replace a lost or expired invitation proof once
      description: Requires invitations.manage on the token tenant. Explicit deny
        overrides other allows, including owner operational privileges. User platform:write,
        current invitations.manage and recent MFA. Empty JSON body; exact resource
        ETag. Only pending/expired invitations; closed returns 409 invalid_invitation_state
        with a current revision. Replaces proof digest and expiry for 24 hours, leaves
        tenant/resource/target email fixed, and makes the current manager responsible
        for subsequent acceptance. Revision and controlled audit/outbox commit atomically;
        no tenant authorization version change. Concurrent same-revision updates allow
        one success, other 412. Acceptance/revocation also increase revision and serialize
        with updates; old proof cannot join afterward. Secret returned once, never
        recoverable or automatically replayed. On uncertain result read metadata and
        explicitly update again if necessary. No invitation email is sent. Generic
        Playground redacts proof; use the dedicated invitation dialog for secure handoff.
