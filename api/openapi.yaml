  /v1/tenants/{tenant}/members/{member}/suspend:
    post:
      operationId: suspendMember
      summary: Suspend a membership
      description: Requires members.write on the token tenant. Explicit deny overrides
        other allows, including owner operational privileges. Recent MFA required.
        Last active owner cannot be suspended. Changes increment membership and tenant
        versions, invalidating existing tenant grants; restoration never revives old
        grants.
      tags:
      - Tenant management
      security:
      - OAuth2:
        - platform:write
      parameters:
      - $ref: '#/components/parameters/TenantID'
      - $ref: '#/components/parameters/memberID'
      - $ref: '#/components/parameters/AuthzMatch'
      responses:
        '204':
          description: Suspend a membership
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '412':
          $ref: '#/components/responses/Problem'
        '413':
          $ref: '#/components/responses/Problem'
        '415':
          $ref: '#/components/responses/Problem'
        '428':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
      x-authorization: permission:members.write
      x-recent-mfa-seconds: 300
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Empty'
            example: &id001 {}
  /v1/tenants/{tenant}/members/{member}/restore:
    post:
      operationId: restoreMember
      summary: Restore a membership
      description: Requires members.write on the token tenant. Explicit deny overrides
        other allows, including owner operational privileges. Recent MFA required.
        Last active owner cannot be suspended. Changes increment membership and tenant
        versions, invalidating existing tenant grants; restoration never revives old
        grants.
      tags:
