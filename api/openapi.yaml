          description: List active spaces of the current user
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantPage'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '412':
          $ref: '#/components/responses/Problem'
        '413':
          $ref: '#/components/responses/Problem'
        '415':
          $ref: '#/components/responses/Problem'
        '428':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
    post:
      operationId: createTenant
      summary: Create a space and initial owner atomically
      description: Recent MFA required. Maximum 20 active owned spaces. The first-party
        platform is enabled in the new space; unrelated applications are not enabled.
        Duplicate slug is 409; no automatic retry or idempotency-key guarantee.
      tags:
      - Identity
      security:
      - OAuth2:
        - platform:write
      parameters: []
      responses:
        '201':
          description: Create a space and initial owner atomically
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            Location:
              description: Created tenant path; obtain a new tenant-bound authorization
                before using it.
              schema: &id002
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantCreated'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '412':
          $ref: '#/components/responses/Problem'
        '413':
          $ref: '#/components/responses/Problem'
        '415':
          $ref: '#/components/responses/Problem'
        '428':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
      x-recent-mfa-seconds: 300
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantInput'
            example:
              slug: example-team
              name: 示例团队
  /v1/tenants/{tenant}:
    get:
      operationId: getTenant
      summary: Get the token-bound space and versions
      description: Requires current User, MFA session and tenant-bound grant.
      tags:
      - Tenant management
      security:
      - OAuth2:
        - platform:read
      parameters:
