          description: Read captured application User admission changes
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationAccessHistoryPage'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
