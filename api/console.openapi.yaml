      security: []
      responses:
        '200':
          description: Public platform OpenAPI, same origin for the authenticated
            Playground; no credentials
          content:
            application/json: {}
components:
  securitySchemes:
    ConsoleCookie:
      type: apiKey
      in: header
      name: Cookie
      description: Browser-managed host-only HttpOnly cookie local_console_session_<X-Console-Context>.
        The context identifier is not a credential. The corresponding cookie is required;
        no Authorization header is accepted.
  schemas:
    Problem:
      type: object
      additionalProperties: false
      required:
      - type
      - title
      - status
      - code
      - request_id
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        code:
          type: string
        request_id:
          type: string
    Me:
      type: object
      additionalProperties: false
      required:
      - user_id
      - tenant_id
      - membership_id
      - session_id
      properties:
        user_id:
          type: string
          pattern: ^[a-f0-9]{32}$
        tenant_id:
          type: string
          pattern: ^[a-f0-9]{32}$
        membership_id:
          type: string
          pattern: ^[a-f0-9]{32}$
        session_id:
          type: string
          pattern: ^[a-f0-9]{32}$
    Tenant:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - slug
      - membership_id
      - owner
      - authz_version
      - org_version
      - root_id
      properties:
        id:
          type: string
          pattern: ^[a-f0-9]{32}$
        name:
          type: string
        slug:
          type: string
          pattern: ^[a-z0-9][a-z0-9-]{0,62}$
        membership_id:
          type: string
          pattern: ^[a-f0-9]{32}$
        owner:
          type: boolean
        authz_version:
          type: integer
          minimum: 1
        org_version:
          type: integer
          minimum: 1
        root_id:
          type: string
          pattern: ^[a-f0-9]{32}$
    TenantInput:
      type: object
      additionalProperties: false
      required:
      - slug
      - name
      properties:
        slug:
          type: string
          pattern: ^[a-z0-9][a-z0-9-]{0,62}$
        name:
          type: string
          minLength: 1
          maxLength: 128
          description: Nonblank, trimmed, at most 128 UTF-8 bytes.
    TenantCreated:
      type: object
      additionalProperties: false
      required:
      - id
      - membership_id
      - root_id
      properties:
        id:
          type: string
          pattern: ^[a-f0-9]{32}$
        membership_id:
          type: string
          pattern: ^[a-f0-9]{32}$
        root_id:
          type: string
          pattern: ^[a-f0-9]{32}$
    Member:
      type: object
      additionalProperties: false
      required:
      - id
      - user_id
      - email
      - status
      - owner
      properties:
        id:
          type: string
          pattern: ^[a-f0-9]{32}$
        user_id:
          type: string
          pattern: ^[a-f0-9]{32}$
        email:
          type:
          - string
          - 'null'
          format: email
          description: Verified alias requires members.read on the token tenant.
        status:
          enum:
          - active
          - invited
          - suspended
          - left
        owner:
          type: boolean
    Organization:
      type: object
      additionalProperties: false
      required:
      - id
      - parent_id
      - name
      properties:
        id:
          type: string
          pattern: ^[a-f0-9]{32}$
        parent_id:
          type:
          - string
          - 'null'
          pattern: ^[a-f0-9]{32}$
        name:
          type: string
    OrganizationInput:
      type: object
      additionalProperties: false
      required:
      - parent_id
      - name
      properties:
        parent_id:
          type: string
          pattern: ^[a-f0-9]{32}$
        name:
          type: string
          minLength: 1
          maxLength: 128
          description: Nonblank, trimmed, at most 128 UTF-8 bytes.
    OrganizationRename:
      type: object
      additionalProperties: false
      required:
      - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
          description: Nonblank trimmed name, at most 128 UTF-8 bytes.
    OrganizationCreated:
      type: object
      additionalProperties: false
      required:
      - id
      - org_version
      properties:
        id:
          type: string
          pattern: ^[a-f0-9]{32}$
        org_version:
          type: integer
          minimum: 1
    MoveInput:
      type: object
      additionalProperties: false
      required:
      - parent_id
      - dry_run
      properties:
        parent_id:
          type: string
          pattern: ^[a-f0-9]{32}$
        dry_run:
          type: boolean
          description: Required; false executes the move and invalidates old tenant
            grants.
    MoveResult:
      type: object
      additionalProperties: false
      required:
      - subtree_nodes
      - resulting_depth
      - org_version
      - dry_run
      properties:
        subtree_nodes:
          type: integer
          minimum: 1
        resulting_depth:
          type: integer
          minimum: 0
          maximum: 16
        org_version:
          type: integer
          minimum: 1
        dry_run:
          type: boolean
    Invitation:
      type: object
      additionalProperties: false
      required:
      - id
      - email
      - expires_at
      - state
      properties:
        id:
          type: string
          pattern: ^[a-f0-9]{32}$
        email:
          type: string
          format: email
        expires_at:
          type: integer
        state:
          enum:
          - pending
          - expired
          - closed
          description: Closed covers accepted or revoked; audit events distinguish
            the transition.
    InvitationDetail:
      type: object
      additionalProperties: false
      required:
      - id
      - email
      - expires_at
      - state
      - revision
      properties:
        id:
          type: string
          pattern: ^[a-f0-9]{32}$
        email:
          type: string
          format: email
        expires_at:
          type: integer
        state:
          enum:
          - pending
          - expired
          - closed
        revision:
          type: integer
          minimum: 1
    InvitationReissued:
      type: object
      additionalProperties: false
      required:
      - id
      - token
      - expires_in
      - revision
      properties:
        id:
          type: string
          pattern: ^[a-f0-9]{32}$
        token:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
          readOnly: true
          description: 'New one-time bearer proof. Replaces the old proof; never restored
            by metadata/GET. Unknown response: read current revision before explicitly
            updating again. No automatic email transport.'
        expires_in:
          type: integer
          const: 86400
        revision:
          type: integer
          minimum: 1
    InvitationInput:
      type: object
      additionalProperties: false
      required:
      - email
      properties:
        email:
          type: string
          format: email
          maxLength: 254
    InvitationCreated:
      type: object
      additionalProperties: false
      required:
      - id
      - token
      - expires_in
      properties:
        id:
          type: string
          pattern: ^[a-f0-9]{32}$
        token:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
          readOnly: true
          description: One-time bearer invitation returned only here; keep out of
            logs. No automatic email transport.
        expires_in:
          type: integer
          const: 86400
    InvitationProof:
      type: object
      additionalProperties: false
      required:
      - token
      properties:
        token:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
          writeOnly: true
    MembershipCreated:
      type: object
      additionalProperties: false
      required:
      - membership_id
      properties:
        membership_id:
          type: string
          pattern: ^[a-f0-9]{32}$
    AuditEvent:
      type: object
