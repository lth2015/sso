        '415':
          $ref: '#/components/responses/Problem'
        '428':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
      x-authorization: reserved_owner:roles.manage
      x-recent-mfa-seconds: 300
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MachineCredentialInput'
            example:
              name: 初始凭证
              expires_in_days: 90
      x-playground-execute: false
      x-playground-reason: Use the dedicated credential page to save the one-time
        SK. Generic Playground redacts secrets and therefore cannot deliver it safely.
