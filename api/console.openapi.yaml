                required:
                - csrf
                - application
                - expires_at
                properties:
                  csrf:
                    type: string
                    pattern: ^[A-Za-z0-9_-]{43}$
                  application:
                    type: string
                  expires_at:
                    type: string
                    format: date-time
        '400': &id001
          $ref: '#/components/responses/Problem'
        '401': &id002
          $ref: '#/components/responses/Problem'
        '403': &id003
          $ref: '#/components/responses/Problem'
        '413': &id004
          $ref: '#/components/responses/Problem'
        '415': &id005
          $ref: '#/components/responses/Problem'
        '429': &id006
          $ref: '#/components/responses/Problem'
        '502': &id007
          $ref: '#/components/responses/Problem'
        '503': &id008
          $ref: '#/components/responses/Problem'
  /session/refresh:
    post:
      operationId: refreshConsoleSession
      summary: Serialize refresh without changing MFA authentication time
      security:
      - ConsoleCookie: []
      parameters:
      - $ref: '#/components/parameters/Context'
      - $ref: '#/components/parameters/CSRF'
      - $ref: '#/components/parameters/Origin'
      responses:
        '204':
          description: Completed; mutation is not automatically replayed
        '400': *id001
        '401': *id002
        '403': *id003
        '413': *id004
        '415': *id005
        '429': *id006
        '502': *id007
        '503': *id008
  /session/logout:
    post:
      operationId: logoutConsoleSession
      summary: Revoke only this context grant/session; other tabs keep their grants
      security:
      - ConsoleCookie: []
      parameters:
      - $ref: '#/components/parameters/Context'
      - $ref: '#/components/parameters/CSRF'
      - $ref: '#/components/parameters/Origin'
      responses:
        '204':
          description: Completed; mutation is not automatically replayed
        '400': *id001
        '401': *id002
        '403': *id003
        '413': *id004
        '415': *id005
        '429': *id006
        '502': *id007
        '503': *id008
  /login:
    get:
      operationId: startConsoleLogin
      summary: Begin real code+S256 PKCE with state/nonce bound to browser cookie
      security: []
      parameters:
      - in: query
        name: force
        schema:
          type: string
          const: '1'
        description: Request max_age=0 for fresh password/MFA.
      - in: query
        name: silent
        schema:
          type: string
          const: '1'
      responses:
        '303':
          description: Fixed Hydra authorization endpoint
        '400': *id001
        '401': *id002
        '403': *id003
        '413': *id004
        '415': *id005
        '429': *id006
        '502': *id007
        '503': *id008
  /oidc/callback:
    get:
      operationId: finishConsoleLogin
      summary: Consume state once, exchange code and verify nonce/signature/MFA
      security: []
      parameters:
      - in: query
        name: state
        required: true
        schema:
          type: string
      - in: query
        name: code
        required: false
        schema:
          type: string
      - in: query
        name: error
        required: false
        schema:
          type: string
      responses:
        '303':
          description: Sets context-specific HttpOnly cookie, redirects to /#workspace=<non-secret
            context ID>. No bearer tokens enter URL or HTML.
        '400': *id001
        '401': *id002
        '403': *id003
        '413': *id004
        '415': *id005
        '429': *id006
        '502': *id007
        '503': *id008
  /bff-openapi.yaml:
    get:
      operationId: getConsoleContract
      security: []
      responses:
        '200':
          description: This same-origin browser API contract
          content:
            application/yaml: {}
  /platform-openapi.json:
    get:
      operationId: getPlaygroundContract
      security: []
      responses:
        '200':
          description: Public platform OpenAPI, same origin for the authenticated
            Playground; no credentials
          content:
            application/json: {}
components:
  securitySchemes:
    ConsoleCookie:
      type: apiKey
      in: header
      name: Cookie
      description: Browser-managed host-only HttpOnly cookie local_console_session_<X-Console-Context>.
        The context identifier is not a credential. The corresponding cookie is required;
        no Authorization header is accepted.
  schemas:
    Problem:
      type: object
      additionalProperties: false
      required:
      - type
      - title
      - status
      - code
      - request_id
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        code:
          type: string
        request_id:
          type: string
    Me:
      type: object
      additionalProperties: false
      required:
      - user_id
      - tenant_id
      - membership_id
      - session_id
      properties:
        user_id:
          type: string
          pattern: ^[a-f0-9]{32}$
        tenant_id:
          type: string
          pattern: ^[a-f0-9]{32}$
        membership_id:
          type: string
          pattern: ^[a-f0-9]{32}$
        session_id:
          type: string
          pattern: ^[a-f0-9]{32}$
    Tenant:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - slug
      - membership_id
      - owner
      - authz_version
      - org_version
      - root_id
      properties:
        id:
          type: string
          pattern: ^[a-f0-9]{32}$
        name:
          type: string
        slug:
          type: string
          pattern: ^[a-z0-9][a-z0-9-]{0,62}$
        membership_id:
          type: string
          pattern: ^[a-f0-9]{32}$
        owner:
          type: boolean
        authz_version:
          type: integer
          minimum: 1
        org_version:
          type: integer
          minimum: 1
        root_id:
          type: string
          pattern: ^[a-f0-9]{32}$
    TenantInput:
      type: object
      additionalProperties: false
      required:
      - slug
      - name
      properties:
        slug:
          type: string
          pattern: ^[a-z0-9][a-z0-9-]{0,62}$
        name:
          type: string
          minLength: 1
          maxLength: 128
          description: Nonblank, trimmed, at most 128 UTF-8 bytes.
    TenantCreated:
      type: object
      additionalProperties: false
      required:
      - id
      - membership_id
      - root_id
      properties:
        id:
          type: string
          pattern: ^[a-f0-9]{32}$
        membership_id:
          type: string
          pattern: ^[a-f0-9]{32}$
        root_id:
          type: string
          pattern: ^[a-f0-9]{32}$
    Member:
      type: object
      additionalProperties: false
      required:
      - id
      - user_id
      - email
      - status
      - owner
      properties:
        id:
          type: string
          pattern: ^[a-f0-9]{32}$
        user_id:
          type: string
          pattern: ^[a-f0-9]{32}$
        email:
          type:
          - string
          - 'null'
          format: email
          description: Verified alias requires members.read on the token tenant.
        status:
          enum:
          - active
          - invited
          - suspended
          - left
        owner:
          type: boolean
    Organization:
      type: object
      additionalProperties: false
      required:
      - id
      - parent_id
      - name
      properties:
        id:
          type: string
          pattern: ^[a-f0-9]{32}$
        parent_id:
          type:
          - string
          - 'null'
          pattern: ^[a-f0-9]{32}$
        name:
          type: string
    OrganizationInput:
      type: object
      additionalProperties: false
      required:
      - parent_id
      - name
      properties:
        parent_id:
          type: string
          pattern: ^[a-f0-9]{32}$
        name:
          type: string
          minLength: 1
          maxLength: 128
          description: Nonblank, trimmed, at most 128 UTF-8 bytes.
    OrganizationCreated:
      type: object
      additionalProperties: false
      required:
      - id
      - org_version
      properties:
        id:
          type: string
          pattern: ^[a-f0-9]{32}$
        org_version:
          type: integer
          minimum: 1
    MoveInput:
      type: object
      additionalProperties: false
      required:
      - parent_id
      - dry_run
      properties:
        parent_id:
          type: string
          pattern: ^[a-f0-9]{32}$
        dry_run:
          type: boolean
          description: Required; false executes the move and invalidates old tenant
            grants.
    MoveResult:
      type: object
      additionalProperties: false
      required:
      - subtree_nodes
      - resulting_depth
      - org_version
      - dry_run
      properties:
        subtree_nodes:
          type: integer
          minimum: 1
        resulting_depth:
          type: integer
          minimum: 0
          maximum: 16
        org_version:
          type: integer
          minimum: 1
        dry_run:
          type: boolean
    Invitation:
      type: object
      additionalProperties: false
      required:
      - id
      - email
      - expires_at
      - state
      properties:
        id:
          type: string
          pattern: ^[a-f0-9]{32}$
        email:
          type: string
          format: email
        expires_at:
          type: integer
        state:
          enum:
          - pending
          - expired
          - closed
          description: Closed covers accepted or revoked; audit events distinguish
            the transition.
    InvitationInput:
      type: object
      additionalProperties: false
      required:
      - email
      properties:
        email:
          type: string
          format: email
          maxLength: 254
    InvitationCreated:
      type: object
      additionalProperties: false
      required:
      - id
      - token
      - expires_in
      properties:
        id:
          type: string
          pattern: ^[a-f0-9]{32}$
        token:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
          readOnly: true
          description: One-time bearer invitation returned only here; keep out of
            logs. No automatic email transport.
        expires_in:
          type: integer
          const: 86400
    InvitationProof:
      type: object
      additionalProperties: false
      required:
      - token
      properties:
        token:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
          writeOnly: true
    MembershipCreated:
      type: object
      additionalProperties: false
      required:
      - membership_id
      properties:
        membership_id:
          type: string
          pattern: ^[a-f0-9]{32}$
    AuditEvent:
      type: object
      additionalProperties: false
      required:
      - id
      - actor_membership_id
      - action
      - target_id
      - occurred_at
      properties:
        id:
          type: string
          pattern: ^[a-f0-9]{32}$
        actor_membership_id:
          type: string
          pattern: ^[a-f0-9]{32}$
        action:
          type: string
        target_id:
          type: string
          pattern: ^[a-f0-9]{32}$
        occurred_at:
          type: string
          format: date-time
        role_id:
          type: string
          pattern: ^[a-f0-9]{32}$
        membership_id:
          type: string
          pattern: ^[a-f0-9]{32}$
        role_code:
          type: string
    SecurityEvent:
      type: object
      additionalProperties: false
      required:
      - id
      - action
      - occurred_at
      properties:
        id:
          type: string
          pattern: ^[a-f0-9]{32}$
        action:
          type: string
          pattern: ^[a-z][a-z0-9_.]{0,63}$
          description: Reviewed security event code; never includes a private target/challenge
            ID or arbitrary payload.
        occurred_at:
          type: string
          format: date-time
    Session:
      type: object
      additionalProperties: false
      required:
      - id
      - current
      - active
      - authenticated_at
      - second_factor
      - idle_expires_at
      - absolute_expires_at
      properties:
        id:
          type: string
          pattern: ^[a-f0-9]{32}$
        current:
          type: boolean
        active:
          type: boolean
        authenticated_at:
          type: integer
        second_factor:
          enum:
          - otp
          - recovery
        idle_expires_at:
          type: integer
        absolute_expires_at:
          type: integer
    Empty:
      type: object
      additionalProperties: false
      required: []
      properties: {}
    TenantPage:
      type: object
      additionalProperties: false
      required:
      - items
      - next_cursor
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/Tenant'
        next_cursor:
          type:
          - string
          - 'null'
          pattern: ^[a-f0-9]{32}$
    MemberPage:
      type: object
      additionalProperties: false
      required:
      - items
      - next_cursor
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/Member'
        next_cursor:
          type:
          - string
          - 'null'
          pattern: ^[a-f0-9]{32}$
    OrganizationPage:
      type: object
      additionalProperties: false
      required:
      - items
      - next_cursor
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/Organization'
        next_cursor:
          type:
          - string
          - 'null'
          pattern: ^[a-f0-9]{32}$
    InvitationPage:
      type: object
      additionalProperties: false
      required:
      - items
      - next_cursor
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/Invitation'
        next_cursor:
          type:
          - string
          - 'null'
          pattern: ^[a-f0-9]{32}$
    AuditEventPage:
      type: object
      additionalProperties: false
      required:
      - items
      - next_cursor
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/AuditEvent'
        next_cursor:
          type:
          - string
          - 'null'
          pattern: ^[a-f0-9]{32}$
    SessionPage:
      type: object
      additionalProperties: false
      required:
      - items
      - next_cursor
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/Session'
        next_cursor:
          type:
          - string
          - 'null'
          pattern: ^[a-f0-9]{32}$
    SecurityEventPage:
      type: object
      additionalProperties: false
      required:
      - items
      - next_cursor
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/SecurityEvent'
        next_cursor:
          type:
          - string
          - 'null'
          pattern: ^[a-f0-9]{32}$
    RolePolicy:
      type: object
      additionalProperties: false
      required:
      - permission
      - effect
      properties:
        permission:
          enum:
          - audit.read
          - invitations.manage
          - members.read
          - members.write
          - organizations.read
          - organizations.write
        effect:
          enum:
          - allow
          - deny
    RoleInput:
      type: object
      additionalProperties: false
      required:
      - code
      - policies
      properties:
        code:
          type: string
          pattern: ^[a-z][a-z0-9_-]{0,62}$
          not:
            const: owner
        policies:
          type: array
          maxItems: 12
          uniqueItems: true
          items:
            $ref: '#/components/schemas/RolePolicy'
    RoleUpdate:
      type: object
      additionalProperties: false
      required:
      - policies
      properties:
        policies:
          type: array
          maxItems: 12
          uniqueItems: true
          items:
            $ref: '#/components/schemas/RolePolicy'
    Role:
      type: object
      additionalProperties: false
      required:
      - id
      - code
      - built_in
      - scope
      - policies
      - binding_count
      properties:
        id:
          type: string
          pattern: ^[a-f0-9]{32}$
        code:
          type: string
        built_in:
          type: boolean
        scope:
          const: tenant
        policies:
          type: array
          items:
            $ref: '#/components/schemas/RolePolicy'
        binding_count:
          type: integer
          minimum: 0
    RolePage:
      type: object
      additionalProperties: false
      required:
      - items
      - next_cursor
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/Role'
        next_cursor:
          type:
          - string
          - 'null'
          pattern: ^[a-f0-9]{32}$
    RoleCreated:
      type: object
      additionalProperties: false
      required:
      - id
      - authz_version
      properties:
        id:
          type: string
          pattern: ^[a-f0-9]{32}$
        authz_version:
          type: integer
          minimum: 1
    MemberRoles:
      type: object
      additionalProperties: false
      required:
      - items
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/Role'
    PermissionSnapshot:
      type: object
      additionalProperties: false
      required:
      - permissions
      - denied
      - owner
      - authz_version
      - catalog
      properties:
        permissions:
          type: array
          uniqueItems: true
          items:
            enum:
            - audit.read
            - invitations.manage
            - members.read
            - members.write
            - organizations.read
            - organizations.write
            - roles.manage
        denied:
          type: array
          uniqueItems: true
          items:
            enum:
            - audit.read
            - invitations.manage
            - members.read
            - members.write
            - organizations.read
            - organizations.write
        owner:
          type: boolean
        authz_version:
          type: integer
          minimum: 1
        catalog:
          type: array
          items:
            enum:
            - audit.read
            - invitations.manage
            - members.read
            - members.write
            - organizations.read
            - organizations.write
    SecuritySummary:
      type: object
      additionalProperties: false
      required:
      - mfa_enabled
      - recovery_codes_remaining
      - active_sessions
      - authenticated_at
      - second_factor
      properties:
        mfa_enabled:
          type: boolean
        recovery_codes_remaining:
          type: integer
          minimum: 0
          maximum: 10
        active_sessions:
          type: integer
          minimum: 0
        authenticated_at:
          type: integer
        second_factor:
          enum:
          - otp
          - recovery
    SessionsRevoked:
      type: object
      additionalProperties: false
      required:
      - revoked_sessions
      properties:
        revoked_sessions:
          type: integer
          minimum: 0
    BFFError:
      type: object
      additionalProperties: false
      required:
      - code
      properties:
        code:
          const: session_unavailable
  parameters:
    TenantID:
      in: path
      name: tenant
      required: true
      description: Must equal the access token tenant; another tenant returns 404,
        even if the user also belongs to it.
      schema:
        type: string
        pattern: ^[a-f0-9]{32}$
    Limit:
      in: query
      name: limit
      description: Bounded keyset page size.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    After:
      in: query
      name: after
      description: Previous next_cursor; ascending UUID keyset, not a snapshot or
        timestamp ordering guarantee.
      schema:
        type: string
        pattern: ^[a-f0-9]{32}$
    AuthzMatch:
      in: header
      name: If-Match
      required: true
      description: 'Latest tenant/members ETag. Missing: 428; stale: 412.'
      schema:
        type: string
        pattern: ^"authz-[1-9][0-9]*"$
    OrgMatch:
      in: header
      name: If-Match
      required: true
      description: 'Latest organizations ETag. Missing: 428; stale: 412.'
      schema:
        type: string
        pattern: ^"org-[1-9][0-9]*"$
    memberID:
      in: path
      name: member
      required: true
      schema:
        type: string
        pattern: ^[a-f0-9]{32}$
    orgID:
      in: path
      name: org
      required: true
      schema:
        type: string
        pattern: ^[a-f0-9]{32}$
    invitationID:
      in: path
      name: invitation
      required: true
      schema:
        type: string
        pattern: ^[a-f0-9]{32}$
    sessionID:
      in: path
      name: session
      required: true
      schema:
        type: string
        pattern: ^[a-f0-9]{32}$
    roleID:
      in: path
      name: role
      required: true
      schema:
        type: string
        pattern: ^[a-f0-9]{32}$
    Context:
      in: header
      name: X-Console-Context
      required: true
      description: Non-secret per-tab authorization context from the callback URL
        fragment. Requires its corresponding HttpOnly cookie.
      schema:
        type: string
        pattern: ^[a-f0-9]{32}$
    CSRF:
      in: header
      name: X-CSRF-Token
      required: true
      description: Read from GET /session into page memory; bound to this context
        session.
      schema:
        type: string
        pattern: ^[A-Za-z0-9_-]{43}$
    Origin:
      in: header
      name: Origin
      required: true
      schema:
        const: http://console.localhost:3003
  responses:
    Problem:
      description: RFC 9457 problem. Fixed code only; no input, token or SQL echoed.
        Codes include invalid_token, forbidden, insufficient_scope, recent_mfa_required,
        tenant_mismatch, invalid_request, not_found, already_exists, reserved_role,
        role_in_use, last_active_owner, root_cannot_move, organization_cycle, version_conflict,
        precondition_required, invalid_precondition, rate_limited, temporarily_unavailable.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        WWW-Authenticate:
          $ref: '#/components/headers/Authenticate'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
        application/json:
          schema:
            $ref: '#/components/schemas/BFFError'
  headers:
    RequestID:
      description: Server-generated request correlation ID.
      schema:
        type: string
    ETag:
      description: Quoted collection version for If-Match.
      schema:
        type: string
    Authenticate:
      description: Bearer challenge, including invalid_token or insufficient_scope.
      schema:
        type: string
    RetryAfter:
      description: Seconds before retrying.
      schema:
        type: integer
