  /bff/v1/tenants/{tenant}/applications/{application}/service-principals/{principal}/disable:
    post:
      operationId: consoleDisableServicePrincipal
      summary: Disable a machine principal
      description: Active owner/recent MFA and exact principal ETag. Changes principal
        security version and User audit/outbox, retaining credentials. Old JWTs fail
