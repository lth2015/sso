      parameters:
      - $ref: '#/components/parameters/Context'
      - $ref: '#/components/parameters/CSRF'
      - $ref: '#/components/parameters/Origin'
      responses:
        '204':
          description: Completed; mutation is not automatically replayed
        '400': *id001
        '401': *id002
        '403': *id003
        '413': *id004
        '415': *id005
        '429': *id006
        '502': *id007
        '503': *id008
  /session/logout:
    post:
      operationId: logoutConsoleSession
      summary: Revoke only this context grant/session; other tabs keep their grants
      security:
