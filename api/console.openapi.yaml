  /session:
    get:
      operationId: getConsoleSession
      summary: Read safe session metadata and CSRF proof; never OAuth tokens
      security:
      - ConsoleCookie: []
      parameters:
      - $ref: '#/components/parameters/Context'
      responses:
        '200':
          description: No-store browser session metadata
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - csrf
                - application
                - expires_at
                properties:
                  csrf:
                    type: string
                    pattern: ^[A-Za-z0-9_-]{43}$
                  application:
                    type: string
                  expires_at:
                    type: string
                    format: date-time
        '400': &id001
          $ref: '#/components/responses/Problem'
        '401': &id002
          $ref: '#/components/responses/Problem'
        '403': &id003
          $ref: '#/components/responses/Problem'
        '413': &id004
          $ref: '#/components/responses/Problem'
        '415': &id005
          $ref: '#/components/responses/Problem'
        '429': &id006
          $ref: '#/components/responses/Problem'
        '502': &id007
          $ref: '#/components/responses/Problem'
        '503': &id008
          $ref: '#/components/responses/Problem'
