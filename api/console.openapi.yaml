openapi: 3.1.0
info:
  title: Identity Console Same-Origin BFF
  version: 0.10.0
  description: Browser cookie+context+CSRF boundary. Proxy paths are restricted to
    the public platform contract and one fixed API destination; caller Authorization
    is rejected. OAuth tokens and verifier remain encrypted server-side. Every tab
    uses an independent context cookie and grant. Automatic refresh may occur before
    a business request; a business mutation is forwarded at most once. API version
    changes require reauthorization. Cookie limit 20 contexts, oldest context cookie
    expires when adding another. Local HTTP reference only; production needs TLS/Secure/__Host-
    policy.
servers:
- url: http://console.localhost:3003
paths:
  /bff/v1/me:
    get:
      operationId: consoleGetMe
      summary: Get the verified current principal
      description: Requires current User, MFA session and tenant-bound grant.
      tags:
      - Identity
      security:
      - ConsoleCookie: []
      parameters:
      - $ref: '#/components/parameters/Context'
      responses:
        '200':
          description: Get the verified current principal
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '412':
          $ref: '#/components/responses/Problem'
        '413':
          $ref: '#/components/responses/Problem'
        '415':
          $ref: '#/components/responses/Problem'
        '428':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /bff/v1/tenants:
    get:
      operationId: consoleListMyTenants
      summary: List active spaces of the current user
      description: Requires current User, MFA session and tenant-bound grant.
      tags:
      - Identity
      security:
      - ConsoleCookie: []
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/After'
      - $ref: '#/components/parameters/Context'
      responses:
        '200':
          description: List active spaces of the current user
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantPage'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '412':
          $ref: '#/components/responses/Problem'
        '413':
          $ref: '#/components/responses/Problem'
        '415':
          $ref: '#/components/responses/Problem'
        '428':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
    post:
      operationId: consoleCreateTenant
      summary: Create a space and initial owner atomically
      description: Recent MFA required. Maximum 20 active owned spaces. The first-party
        platform is enabled in the new space; unrelated applications are not enabled.
        Duplicate slug is 409; no automatic retry or idempotency-key guarantee.
      tags:
      - Identity
      security:
      - ConsoleCookie: []
      parameters:
      - $ref: '#/components/parameters/Context'
      - $ref: '#/components/parameters/CSRF'
      - $ref: '#/components/parameters/Origin'
      responses:
        '201':
          description: Create a space and initial owner atomically
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            Location:
              description: Created tenant path; obtain a new tenant-bound authorization
                before using it.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantCreated'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '412':
          $ref: '#/components/responses/Problem'
        '413':
          $ref: '#/components/responses/Problem'
        '415':
          $ref: '#/components/responses/Problem'
        '428':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
      x-recent-mfa-seconds: 300
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantInput'
            example:
              slug: example-team
              name: 示例团队
  /bff/v1/tenants/{tenant}:
    get:
      operationId: consoleGetTenant
      summary: Get the token-bound space and versions
      description: Requires current User, MFA session and tenant-bound grant.
      tags:
      - Tenant management
      security:
      - ConsoleCookie: []
      parameters:
      - $ref: '#/components/parameters/TenantID'
      - $ref: '#/components/parameters/Context'
      responses:
        '200':
          description: Get the token-bound space and versions
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '412':
          $ref: '#/components/responses/Problem'
        '413':
          $ref: '#/components/responses/Problem'
        '415':
          $ref: '#/components/responses/Problem'
        '428':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /bff/v1/tenants/{tenant}/members:
    get:
      operationId: consoleListMembers
      summary: List space memberships
      description: 'Requires members.read on the token tenant. Explicit deny overrides
        other allows, including owner operational privileges. '
      tags:
      - Tenant management
      security:
      - ConsoleCookie: []
      parameters:
      - $ref: '#/components/parameters/TenantID'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/After'
      - $ref: '#/components/parameters/Context'
      responses:
        '200':
          description: List space memberships
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberPage'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '412':
          $ref: '#/components/responses/Problem'
        '413':
          $ref: '#/components/responses/Problem'
        '415':
          $ref: '#/components/responses/Problem'
        '428':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
      x-authorization: permission:members.read
  /bff/v1/tenants/{tenant}/members/{member}/suspend:
    post:
      operationId: consoleSuspendMember
      summary: Suspend a membership
      description: Requires members.write on the token tenant. Explicit deny overrides
        other allows, including owner operational privileges. Recent MFA required.
        Last active owner cannot be suspended. Changes increment membership and tenant
        versions, invalidating existing tenant grants; restoration never revives old
        grants.
      tags:
      - Tenant management
      security:
      - ConsoleCookie: []
      parameters:
      - $ref: '#/components/parameters/TenantID'
      - $ref: '#/components/parameters/memberID'
      - $ref: '#/components/parameters/AuthzMatch'
      - $ref: '#/components/parameters/Context'
      - $ref: '#/components/parameters/CSRF'
      - $ref: '#/components/parameters/Origin'
      responses:
        '204':
          description: Suspend a membership
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '412':
          $ref: '#/components/responses/Problem'
        '413':
          $ref: '#/components/responses/Problem'
        '415':
          $ref: '#/components/responses/Problem'
        '428':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
      x-authorization: permission:members.write
      x-recent-mfa-seconds: 300
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Empty'
            example: {}
  /bff/v1/tenants/{tenant}/members/{member}/restore:
    post:
      operationId: consoleRestoreMember
      summary: Restore a membership
      description: Requires members.write on the token tenant. Explicit deny overrides
        other allows, including owner operational privileges. Recent MFA required.
        Last active owner cannot be suspended. Changes increment membership and tenant
        versions, invalidating existing tenant grants; restoration never revives old
        grants.
      tags:
      - Tenant management
      security:
      - ConsoleCookie: []
      parameters:
      - $ref: '#/components/parameters/TenantID'
      - $ref: '#/components/parameters/memberID'
      - $ref: '#/components/parameters/AuthzMatch'
      - $ref: '#/components/parameters/Context'
      - $ref: '#/components/parameters/CSRF'
      - $ref: '#/components/parameters/Origin'
      responses:
        '204':
          description: Restore a membership
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '412':
          $ref: '#/components/responses/Problem'
        '413':
          $ref: '#/components/responses/Problem'
        '415':
          $ref: '#/components/responses/Problem'
        '428':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
      x-authorization: permission:members.write
      x-recent-mfa-seconds: 300
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Empty'
            example: {}
  /bff/v1/tenants/{tenant}/organizations:
    get:
      operationId: consoleListOrganizations
      summary: List space organization nodes
      description: 'Requires organizations.read on the token tenant. Explicit deny
        overrides other allows, including owner operational privileges. '
      tags:
      - Tenant management
      security:
      - ConsoleCookie: []
      parameters:
      - $ref: '#/components/parameters/TenantID'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/After'
      - $ref: '#/components/parameters/Context'
      responses:
        '200':
          description: List space organization nodes
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationPage'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '412':
          $ref: '#/components/responses/Problem'
        '413':
          $ref: '#/components/responses/Problem'
        '415':
          $ref: '#/components/responses/Problem'
        '428':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
      x-authorization: permission:organizations.read
    post:
      operationId: consoleCreateOrganization
      summary: Create an organization under an existing parent
      description: 'Requires organizations.write on the token tenant. Explicit deny
        overrides other allows, including owner operational privileges. '
      tags:
      - Tenant management
      security:
      - ConsoleCookie: []
      parameters:
      - $ref: '#/components/parameters/TenantID'
      - $ref: '#/components/parameters/OrgMatch'
      - $ref: '#/components/parameters/Context'
      - $ref: '#/components/parameters/CSRF'
      - $ref: '#/components/parameters/Origin'
      responses:
        '201':
          description: Create an organization under an existing parent
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationCreated'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '412':
          $ref: '#/components/responses/Problem'
        '413':
          $ref: '#/components/responses/Problem'
        '415':
          $ref: '#/components/responses/Problem'
        '428':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
      x-authorization: permission:organizations.write
      x-recent-mfa-seconds: 300
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationInput'
            example:
              parent_id: '00000000000000000000000000000000'
              name: 示例组织
  /bff/v1/tenants/{tenant}/organizations/{org}/move:
    post:
      operationId: consoleMoveOrganization
      summary: Preview or execute an organization move
      description: Requires organizations.write on the token tenant. Explicit deny
        overrides other allows, including owner operational privileges. Recent MFA
        required, including preview. Root/cycle/depth checks apply. Preview changes
        no state. Executing changes organization and tenant authorization versions;
        obtain a new authorization afterwards.
      tags:
      - Tenant management
      security:
      - ConsoleCookie: []
      parameters:
      - $ref: '#/components/parameters/TenantID'
      - $ref: '#/components/parameters/orgID'
      - $ref: '#/components/parameters/OrgMatch'
      - $ref: '#/components/parameters/Context'
      - $ref: '#/components/parameters/CSRF'
      - $ref: '#/components/parameters/Origin'
      responses:
        '200':
          description: Preview or execute an organization move
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoveResult'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '412':
          $ref: '#/components/responses/Problem'
        '413':
          $ref: '#/components/responses/Problem'
        '415':
          $ref: '#/components/responses/Problem'
        '428':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
      x-authorization: permission:organizations.write
      x-recent-mfa-seconds: 300
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoveInput'
            example:
              parent_id: '00000000000000000000000000000000'
              dry_run: true
  /bff/v1/tenants/{tenant}/organizations/{org}/members/{member}:
    put:
      operationId: consoleAssignOrganization
      summary: Associate a membership with an organization
      description: Requires organizations.write on the token tenant. Explicit deny
        overrides other allows, including owner operational privileges. Association
        does not grant owner or other roles. Changes tenant authorization version;
        obtain a new authorization afterwards.
      tags:
      - Tenant management
      security:
      - ConsoleCookie: []
      parameters:
      - $ref: '#/components/parameters/TenantID'
      - $ref: '#/components/parameters/memberID'
      - $ref: '#/components/parameters/orgID'
      - $ref: '#/components/parameters/AuthzMatch'
      - $ref: '#/components/parameters/Context'
      - $ref: '#/components/parameters/CSRF'
      - $ref: '#/components/parameters/Origin'
      responses:
        '204':
          description: Associate a membership with an organization
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '412':
          $ref: '#/components/responses/Problem'
        '413':
          $ref: '#/components/responses/Problem'
        '415':
          $ref: '#/components/responses/Problem'
        '428':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
      x-authorization: permission:organizations.write
      x-recent-mfa-seconds: 300
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Empty'
            example: {}
  /bff/v1/tenants/{tenant}/invitations:
    get:
      operationId: consoleListInvitations
      summary: List invitation metadata without bearer secrets
      description: 'Requires invitations.manage on the token tenant. Explicit deny
        overrides other allows, including owner operational privileges. '
      tags:
      - Tenant management
      security:
      - ConsoleCookie: []
      parameters:
      - $ref: '#/components/parameters/TenantID'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/After'
      - $ref: '#/components/parameters/Context'
      responses:
        '200':
          description: List invitation metadata without bearer secrets
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationPage'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '412':
          $ref: '#/components/responses/Problem'
        '413':
          $ref: '#/components/responses/Problem'
        '415':
          $ref: '#/components/responses/Problem'
        '428':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
      x-authorization: permission:invitations.manage
    post:
      operationId: consoleCreateInvitation
      summary: Create an email-bound one-time invitation
      description: Requires invitations.manage on the token tenant. Explicit deny
        overrides other allows, including owner operational privileges. Recent MFA
        required. Token is returned once, stored only as a digest and never in audit/outbox.
        The caller delivers it securely; no external email is sent. Invitations grant
        membership only.
      tags:
      - Tenant management
      security:
      - ConsoleCookie: []
      parameters:
      - $ref: '#/components/parameters/TenantID'
      - $ref: '#/components/parameters/Context'
      - $ref: '#/components/parameters/CSRF'
      - $ref: '#/components/parameters/Origin'
      responses:
        '201':
          description: Create an email-bound one-time invitation
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationCreated'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '412':
          $ref: '#/components/responses/Problem'
        '413':
          $ref: '#/components/responses/Problem'
        '415':
          $ref: '#/components/responses/Problem'
        '428':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
      x-authorization: permission:invitations.manage
      x-recent-mfa-seconds: 300
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationInput'
            example:
              email: teammate@example.invalid
  /bff/v1/tenants/{tenant}/invitations/{invitation}/revoke:
    post:
      operationId: consoleRevokeInvitation
      summary: Close an invitation so its proof cannot be accepted
      description: Requires invitations.manage on the token tenant. Explicit deny
        overrides other allows, including owner operational privileges. Recent MFA
        required. Idempotently closes the proof; already closed proofs stay closed.
        Audit records the first revocation; closed includes accepted or revoked.
      tags:
      - Tenant management
      security:
      - ConsoleCookie: []
      parameters:
      - $ref: '#/components/parameters/TenantID'
      - $ref: '#/components/parameters/invitationID'
      - $ref: '#/components/parameters/Context'
      - $ref: '#/components/parameters/CSRF'
      - $ref: '#/components/parameters/Origin'
      responses:
        '204':
          description: Close an invitation so its proof cannot be accepted
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '412':
          $ref: '#/components/responses/Problem'
        '413':
          $ref: '#/components/responses/Problem'
        '415':
          $ref: '#/components/responses/Problem'
        '428':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
      x-authorization: permission:invitations.manage
      x-recent-mfa-seconds: 300
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Empty'
            example: {}
  /bff/v1/invitations/accept:
    post:
      operationId: consoleAcceptInvitation
      summary: Consume an invitation for the verified user
      description: Recent MFA required. The proof selects the destination tenant.
        Verified email must match; membership only, no implicit role. Consumed/expired/revoked
        proofs are invalid. Acceptance increments destination tenant authorization
        version.
      tags:
      - Identity
      security:
      - ConsoleCookie: []
      parameters:
      - $ref: '#/components/parameters/Context'
      - $ref: '#/components/parameters/CSRF'
      - $ref: '#/components/parameters/Origin'
      responses:
        '201':
          description: Consume an invitation for the verified user
          headers:
            X-Request-ID:
