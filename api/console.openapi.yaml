      name: If-Match
      required: true
      description: Exact principal detail version bound to tenant/principal.
      schema:
        type: string
        pattern: ^"sp-[a-f0-9]{32}-[a-f0-9]{32}-[1-9][0-9]*"$
    InvitationMatch:
      in: header
      name: If-Match
      required: true
      description: Exact current invitation detail revision, bound to tenant and invitation.
        Missing 428, malformed 400, stale/other resource 412. Acceptance, revocation
        and reissue invalidate earlier revisions.
      schema:
        type: string
        pattern: ^"invite-[a-f0-9]{32}-[a-f0-9]{32}-[1-9][0-9]*"$
    CredentialMatch:
      in: header
      name: If-Match
      required: true
      description: Exact credential detail API revision, including overlap expiry
        changes. It is distinct from the private JWT security version.
      schema:
        type: string
        pattern: ^"cred-[a-f0-9]{32}-[a-f0-9]{32}-[1-9][0-9]*"$
    ClientMatch:
      in: header
      name: If-Match
      required: true
      description: Exact managed-client detail ETag bound to tenant/client/version.
        Missing 428, malformed 400, stale/other resource 412.
      schema:
        type: string
        pattern: ^"client-[a-f0-9]{32}-[a-f0-9]{32}-[1-9][0-9]*"$
    TenantID:
      in: path
      name: tenant
      required: true
      description: Must equal the access token tenant; another tenant returns 404,
        even if the user also belongs to it.
      schema:
        type: string
        pattern: ^[a-f0-9]{32}$
    Limit:
      in: query
      name: limit
      description: Bounded keyset page size.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    After:
      in: query
      name: after
      description: Previous next_cursor; ascending UUID keyset, not a snapshot or
        timestamp ordering guarantee.
      schema:
        type: string
        pattern: ^[a-f0-9]{32}$
    ApplicationMatch:
      in: header
      name: If-Match
      required: true
      description: 'Exact application detail ETag, bound to tenant/application/version.
        Missing: 428; wrong resource or stale: 412.'
      schema:
        type: string
        pattern: ^"app-[a-f0-9]{32}-[a-f0-9]{32}-[1-9][0-9]*"$
    ClientAfter:
      in: query
      name: after
      description: Previous client page next_cursor. Ascending printable client_id,
        not a UUID or pagination snapshot. URL-encode it.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: ^[!-~]{1,128}$
    AuthzMatch:
      in: header
      name: If-Match
      required: true
      description: 'Latest tenant/members ETag. Missing: 428; stale: 412.'
      schema:
        type: string
        pattern: ^"authz-[1-9][0-9]*"$
    OrgMatch:
      in: header
      name: If-Match
      required: true
      description: 'Latest organizations ETag. Missing: 428; stale: 412.'
      schema:
        type: string
        pattern: ^"org-[1-9][0-9]*"$
    memberID:
      in: path
      name: member
      required: true
      schema:
        type: string
        pattern: ^[a-f0-9]{32}$
    orgID:
      in: path
      name: org
      required: true
      schema:
        type: string
        pattern: ^[a-f0-9]{32}$
    invitationID:
      in: path
      name: invitation
      required: true
      schema:
        type: string
        pattern: ^[a-f0-9]{32}$
    sessionID:
      in: path
      name: session
      required: true
      schema:
        type: string
        pattern: ^[a-f0-9]{32}$
    roleID:
      in: path
      name: role
      required: true
      schema:
        type: string
        pattern: ^[a-f0-9]{32}$
    applicationID:
      in: path
      name: application
      required: true
      schema:
        type: string
        pattern: ^[a-f0-9]{32}$
    clientID:
      in: path
      name: client
      required: true
      schema:
        type: string
        pattern: ^[a-f0-9]{32}$
    principalID:
      in: path
      name: principal
      required: true
      schema:
        type: string
        pattern: ^[a-f0-9]{32}$
    credentialID:
      in: path
      name: credential
      required: true
      schema:
        type: string
        pattern: ^[a-f0-9]{32}$
    Context:
      in: header
      name: X-Console-Context
      required: true
      description: Non-secret per-tab authorization context from the callback URL
        fragment. Requires its corresponding HttpOnly cookie.
      schema:
        type: string
        pattern: ^[a-f0-9]{32}$
    CSRF:
      in: header
      name: X-CSRF-Token
      required: true
      description: Read from GET /session into page memory; bound to this context
        session.
      schema:
        type: string
        pattern: ^[A-Za-z0-9_-]{43}$
    Origin:
      in: header
      name: Origin
      required: true
      schema:
        const: http://console.localhost:3003
  responses:
    Problem:
      description: RFC 9457 problem. Fixed code only; no input, token or SQL echoed.
        Codes include credential_limit, invalid_credential_state, service_principal_disabled,
        application_unmanaged, observation_changed, invalid_client_state, invalid_invitation_state,
        protocol_client_conflict, protected_organization, organization_not_empty,
        protected_application, application_unavailable, invalid_token, forbidden,
        insufficient_scope, recent_mfa_required, tenant_mismatch, invalid_request,
        not_found, already_exists, reserved_role, role_in_use, last_active_owner,
        root_cannot_move, organization_cycle, version_conflict, precondition_required,
        invalid_precondition, rate_limited, temporarily_unavailable.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        WWW-Authenticate:
          $ref: '#/components/headers/Authenticate'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
        application/json:
          schema:
            $ref: '#/components/schemas/BFFError'
  headers:
    RequestID:
      description: Server-generated request correlation ID.
      schema:
        type: string
    ETag:
      description: Quoted resource or collection version for If-Match.
      schema:
        type: string
    Authenticate:
      description: Bearer challenge, including invalid_token or insufficient_scope.
      schema:
        type: string
    RetryAfter:
      description: Seconds before retrying.
      schema:
        type: integer
