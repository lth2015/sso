  /bff/v1/tenants/{tenant}/applications/{application}/service-principals/{principal}/credentials/{credential}/revoke:
    post:
      operationId: consoleRevokeMachineCredential
      summary: Irreversibly revoke a machine credential
      description: Active owner/recent MFA. Pending/active/expired becomes revoked
        with higher API/security versions and transactional User audit/outbox; same-state/current
        revision no-op. Key and all old machine JWTs are refused by primary authority
        immediately. Other keys, SPs and User login remain valid; no shared SID logout.
        Revoke still works when SP/app is disabled.
      tags:
      - Tenant management
      security:
      - ConsoleCookie: []
      parameters:
