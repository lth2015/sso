        '415':
          $ref: '#/components/responses/Problem'
        '428':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
      x-authorization: reserved_owner:roles.manage
    post:
      operationId: consoleCreateMachineCredential
      summary: Issue an independent one-time AK/SK credential
      description: 'Active owner/recent MFA and enabled owned app/principal. TTL 1–90
        days, maximum two live active/pending credentials and 100 lifetime records
        per principal. Fixed client_credentials-only, machine:invoke and this app
        URN audience; no platform management/refresh/ID token. Commits pending, registers
        and verifies exact private engine profile, then rechecks User authority and
        principal/application versions before activation. SK returned only here and
        never stored recoverably in business DB. Unknown response/commit: GET/list,
        revoke and create a new credential; pending cannot be reconciled active or
        have SK recovered. On successful activation only, other active key expiry
        is shortened to at most 24h overlap; API revision changes, security version
        remains, so cached old JWT stays usable during overlap. Failed creation preserves
        prior key expiry. No automatic request replay.'
      tags:
      - Tenant management
      security:
      - ConsoleCookie: []
      parameters:
      - $ref: '#/components/parameters/TenantID'
      - $ref: '#/components/parameters/applicationID'
      - $ref: '#/components/parameters/principalID'
      - $ref: '#/components/parameters/Context'
      - $ref: '#/components/parameters/CSRF'
      - $ref: '#/components/parameters/Origin'
      responses:
