    post:
      operationId: consoleCreateServicePrincipal
      summary: Create a tenant-owned machine identity
      description: Active owner/recent MFA; app must be owned/enabled/available. Maximum
        100 principals per app. SP belongs to the tenant owner collective, not the
        creator personal session. No machine key or User grant is created; current
        User authorization stays valid.
      tags:
      - Tenant management
      security:
      - ConsoleCookie: []
      parameters:
      - $ref: '#/components/parameters/TenantID'
      - $ref: '#/components/parameters/applicationID'
      - $ref: '#/components/parameters/Context'
      - $ref: '#/components/parameters/CSRF'
      - $ref: '#/components/parameters/Origin'
      responses:
        '201':
          description: Create a tenant-owned machine identity
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            ETag:
              $ref: '#/components/headers/ETag'
            Location:
              description: Created resource path; read metadata here after a result
                is known.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServicePrincipal'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
