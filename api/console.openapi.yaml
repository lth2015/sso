  /bff/v1/tenants/{tenant}/applications/{application}/service-principals/{principal}/credentials/{credential}/cleanup:
    post:
      operationId: consoleCleanupMachineCredential
      summary: Clean up a matching revoked credential protocol object
      description: Active owner/recent MFA. Only revoked credentials; never activates
        pending or reveals/recreates SK. Fixed private Admin profile/ownership check;
        foreign/drifted objects not deleted. Local revoked tombstone persists even
        when remote cleanup fails. Absence is observed, not a permanent assurance
        about old timed-out transactions. Works with disabled SP/app.
      tags:
      - Tenant management
      security:
      - ConsoleCookie: []
      parameters:
      - $ref: '#/components/parameters/TenantID'
      - $ref: '#/components/parameters/applicationID'
      - $ref: '#/components/parameters/principalID'
      - $ref: '#/components/parameters/credentialID'
      - $ref: '#/components/parameters/CredentialMatch'
      - $ref: '#/components/parameters/Context'
      - $ref: '#/components/parameters/CSRF'
      - $ref: '#/components/parameters/Origin'
      responses:
