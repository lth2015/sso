      summary: Reconcile the exact owned protocol client profile
      description: 'Active owner and recent MFA, exact ETag, total four-second authority
        transaction bound. Pending: read the fixed Admin destination, create if absent,
        read back and verify exact profile and ownership before activation/version/audit
        commit. Active: verify profile without changing authority. Revoked: delete
        only a matching owned engine object, retaining the revoked tombstone and auditing
        the cleanup check. Foreign/drifted profile is 409 protocol_client_conflict
        and never overwritten/deleted/adopted. Global/local app disable blocks activation,
        not revocation/cleanup. Unknown transport/commit outcome is not auto-replayed:
        reread state and choose a fresh reconciliation. Local pending/revoked clients
        cannot issue usable business tokens, including remote orphans. Absence is
        observed, not permanent physical-deletion assurance.'
