        '400': *id001
        '401': *id002
        '403': *id003
        '413': *id004
        '415': *id005
        '429': *id006
        '502': *id007
        '503': *id008
  /login:
    get:
      operationId: startConsoleLogin
      summary: Begin real code+S256 PKCE with state/nonce bound to browser cookie
      security: []
      parameters:
      - in: query
        name: force
        schema:
          type: string
          const: '1'
        description: Request max_age=0 for fresh password/MFA.
      - in: query
        name: silent
        schema:
          type: string
          const: '1'
      responses:
        '303':
          description: Fixed Hydra authorization endpoint
        '400': *id001
        '401': *id002
        '403': *id003
        '413': *id004
        '415': *id005
        '429': *id006
        '502': *id007
        '503': *id008
  /oidc/callback:
    get:
