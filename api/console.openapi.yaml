          type: string
          pattern: ^"client-[a-f0-9]{32}-[a-f0-9]{32}-[1-9][0-9]*"$
          description: Current local resource write precondition, not an HTTP validator
            for this time-varying observation.
        local_state:
          enum:
          - pending
          - active
          - revoked
        profile_state:
          enum:
          - matching
          - absent
          - conflict
        differences:
          type: array
          maxItems: 9
          uniqueItems: true
          items:
            enum:
            - client_id
            - client_name
            - token_endpoint_auth_method
            - redirect_uris
            - grant_types
            - response_types
            - scope
            - audience
            - metadata
        observed_at:
          type: string
          format: date-time
        authority_checked_at:
          type: string
          format: date-time
      allOf:
      - if:
          properties:
            profile_state:
              const: conflict
        then:
          properties:
            differences:
              minItems: 1
        else:
          properties:
            differences:
              maxItems: 0
