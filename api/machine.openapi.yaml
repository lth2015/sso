openapi: 3.1.0
info:
  title: SSO Machine Credential Protocol and Business Resource Reference
  version: 0.26.0
  description: Separate machine realm. No User Cookie/MFA or platform management permission
    is inferred. Local acceptance; SRE owns deployment.
servers:
- url: http://api.localhost:8083
paths:
  /v1/machine/applications/{application}/identity:
    get:
      operationId: getMachineBusinessIdentity
      summary: Read the verified machine identity for this application resource
      description: Business resource reference, separate from User platform management.
        Expected audience is constructed from this application path. RS256 issuer/signature/expiry,
        exactly machine:invoke, service_principal claims and key/principal/application/tenant
        versions are checked. Primary credential expiry/state and SP/application/tenant
        enablement are checked for every request; fail closed. An old JWT never revives
        after SP/application restoration. User tokens and machine tokens for another
        app are rejected. This route is absent from the Console BFF whitelist and
        User Playground. This sample does not prove that external consumers doing
        signature-only JWT checks revoke instantly.
      parameters:
      - in: path
        name: application
        required: true
        schema: &id001
          type: string
          pattern: ^[a-f0-9]{32}$
      security:
      - MachineOAuth2:
        - machine:invoke
      responses:
        '200':
          description: No-store identity metadata; not the token or SK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MachineIdentity'
        '400':
          description: Machine resource RFC 9457 problem; no upstream token/secret/body
            echo.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Machine resource RFC 9457 problem; no upstream token/secret/body
            echo.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Machine resource RFC 9457 problem; no upstream token/secret/body
            echo.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Machine resource RFC 9457 problem; no upstream token/secret/body
            echo.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Machine resource RFC 9457 problem; no upstream token/secret/body
            echo.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: Machine resource RFC 9457 problem; no upstream token/secret/body
            echo.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /oauth2/token:
    post:
      operationId: exchangeMachineCredential
      summary: Exchange AK/SK for a short machine access token
      servers:
      - url: http://auth.localhost:4464
      description: Ory Hydra protocol endpoint, not an RFC 9457 platform operation.
        HTTP Basic username=access_key and password=one-time secret_key. Client credentials
        only; no refresh/ID token. Explicit fixed scope and the registered application
        audience. Tenant/principal come exclusively from primary registry. The private
        hook refuses pending/orphan/expired/revoked/disabled credentials. Source SK
        cannot be recovered from GET/reconcile; owner revokes/recreates after creation
        response loss. Local HTTP acceptance only; production TLS is required.
      security:
      - AccessKeyBasic: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MachineTokenRequest'
      responses:
        '200':
          description: Short bearer response; keep in process memory only.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MachineTokenResponse'
        '400':
          description: Engine OAuth problem; no platform RFC 9457 guarantee.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EngineProblem'
        '401':
          description: Engine OAuth problem; no platform RFC 9457 guarantee.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EngineProblem'
        '403':
          description: Engine OAuth problem; no platform RFC 9457 guarantee.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EngineProblem'
        '429':
          description: Engine OAuth problem; no platform RFC 9457 guarantee.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EngineProblem'
        '503':
          description: Engine OAuth problem; no platform RFC 9457 guarantee.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EngineProblem'
components:
  schemas:
    Problem:
      type: object
      additionalProperties: false
      required:
      - type
      - title
      - status
      - code
      - request_id
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        code:
          type: string
        request_id:
          type: string
    MachineIdentity:
      type: object
      additionalProperties: false
      required:
      - principal_type
      - tenant_id
      - application_id
      - service_principal_id
      - credential_id
      - scope
      - audience
      properties:
        principal_type:
          const: service_principal
        tenant_id: *id001
        application_id: *id001
        service_principal_id: *id001
        credential_id: *id001
        scope:
          const: machine:invoke
        audience: &id002
          type: string
          pattern: ^urn:sso:application:[a-f0-9]{32}$
    MachineTokenRequest:
      type: object
      additionalProperties: true
      required:
      - grant_type
      - scope
      - audience
      properties:
        grant_type:
          const: client_credentials
        scope:
          const: machine:invoke
        audience: *id002
    MachineTokenResponse:
      type: object
      required:
      - access_token
      - expires_in
      - token_type
      - scope
      properties:
        access_token:
          type: string
          description: Bearer secret; never log/store in browser. RS256 JWT with machine
            principal and primary-bound versions, not a User/MFA session.
        expires_in:
          type: integer
          minimum: 0
          maximum: 300
        token_type:
          type: string
        scope:
          const: machine:invoke
    EngineProblem:
      type: object
      properties:
        error:
          type: string
        error_description:
          type: string
  securitySchemes:
    AccessKeyBasic:
      type: http
      scheme: basic
    MachineOAuth2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: http://auth.localhost:4464/oauth2/token
          scopes:
            machine:invoke: Invoke the registered application resource only
