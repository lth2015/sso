openapi: 3.1.0
info:
  title: SSO M0 Internal Policy Hook
  version: 0.1.0
  description: Internal laboratory contract only. Never route publicly; synthetic contexts do not implement production identity APIs.
paths:
  /health/ready:
    get:
      responses:
        '204': {description: Database reachable}
        '503': {description: Database unavailable}
  /token-hook:
    post:
      security: [{hookKey: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [request, session]
              properties:
                request:
                  type: object
                  required: [client_id, grant_types]
                  properties:
                    client_id: {type: string}
                    grant_types:
                      type: array
                      minItems: 1
                      maxItems: 1
                      items: {enum: [authorization_code, refresh_token, client_credentials]}
                    granted_scopes: {type: array, items: {type: string}}
                    granted_audience: {type: array, items: {type: string}}
                session:
                  type: object
                  properties:
                    id_token:
                      type: object
                      properties:
                        subject: {type: string}
                    extra:
                      type: object
                      description: Only the opaque m0_context_id is consumed. Grant boundaries are loaded from the authoritative database; never browser input.
      responses:
        '200':
          description: Qualified issuance with controlled claims, wrapped in ext by Hydra
          content:
            application/json:
              schema:
                type: object
                required: [session]
                properties:
                  session:
                    type: object
                    required: [access_token, id_token]
                    properties:
                      access_token: {type: object}
                      id_token: {type: object}
        '400': {description: Invalid or oversized JSON}
        '401': {description: Hook caller not authenticated}
        '403': {description: Qualification or grant boundary denied}
        '503': {description: Authority or audit unavailable; issuance denied}
components:
  securitySchemes:
    hookKey:
      type: apiKey
      in: header
      name: X-Hook-Key
