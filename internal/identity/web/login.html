<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="flow-id" content="{{.ID}}"><meta name="flow-csrf" content="{{.CSRF}}"><meta name="flow-kind" content="{{.Kind}}"><title>Identity · 统一登录</title><link rel="stylesheet" href="/flow/login.css"><script src="/flow/login.js" defer></script></head><body><div class="local">本地开发环境 · 统一身份验证</div><main><div class="brand">◈ Identity</div><section class="card"><p class="eyebrow" id="application">统一身份服务</p><h1 id="title">正在验证登录请求</h1><p id="description" class="muted"></p>
<form id="password-form" hidden><label for="email">邮箱地址</label><input id="email" type="email" autocomplete="username" required maxlength="254"><label for="password">密码</label><input id="password" type="password" autocomplete="current-password" required maxlength="128"><button type="submit">继续</button><a href="/account">创建账户或找回密码</a></form>
<form id="mfa-form" hidden><div id="setup" hidden><p>在你的认证器中添加此密钥。密钥只在此步骤显示，请勿分享。</p><code id="secret"></code></div><label for="code">动态验证码</label><input id="code" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6"><details id="recovery-option"><summary>使用恢复码</summary><label for="recovery">一次性恢复码</label><input id="recovery" autocomplete="off" maxlength="40"></details><button type="submit">验证身份</button></form>
<div id="passed" hidden><div id="codes-panel" hidden><h2>保存一次性恢复码</h2><p>每个恢复码只能使用一次，关闭此页后无法再次查看。请保存在安全位置。</p><pre id="codes"></pre></div><button id="continue">我已安全保存，继续</button></div>
<form id="consent-form" hidden><label for="tenant">选择本次访问的空间</label><select id="tenant" required></select><p class="muted">授权范围：<span id="scopes"></span></p><button type="submit">同意并继续</button></form>
<button id="reject" class="link" type="button" hidden>取消本次授权</button><button id="logout" hidden>退出所有设备的统一登录</button><p id="status" role="status" aria-live="polite"></p><p id="error" role="alert"></p></section><p class="footnote">仅在此统一认证页面输入密码和验证码。应用无法读取这些身份凭证。</p></main></body></html>
