<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="security-state" content="{{.State}}"><meta name="security-id" content="{{.ID}}"><meta name="security-csrf" content="{{.CSRF}}"><title>Identity · 恢复码管理</title><link rel="stylesheet" href="/sso/security.css"><script src="/sso/security.js" defer></script></head><body><main><div class="brand">◈ Identity</div><section class="card"><p class="eyebrow">账户安全 · 统一认证域</p><h1>重新生成恢复码</h1>{{if eq .State "ready"}}<p>使用当前密码和认证器的新动态验证码确认身份。旧恢复码及所有现有登录会话将立即失效。</p><p class="note">刚使用过的 TOTP 不能重用，请等待下一组验证码。此操作不能使用恢复码代替认证器。</p><form id="security-form"><label for="password">当前密码</label><input id="password" type="password" autocomplete="current-password" maxlength="128" required><label for="code">认证器动态验证码</label><input id="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required><label class="confirm"><input id="confirmed" type="checkbox" required>我确认使旧恢复码和全部登录会话失效</label><button type="submit">验证并生成新恢复码</button></form><section id="saved" hidden><h2>保存新的恢复码</h2><p>每个码仅能使用一次，关闭后无法再次查看。请保存在安全位置；所有旧会话已撤销。</p><pre id="codes"></pre><button id="done" type="button">我已安全保存，重新登录</button></section><p id="status" role="status" aria-live="polite"></p><p id="error" role="alert"></p>{{else}}<p>当前统一登录已失效。请从控制台发起登录、完成密码与 MFA，再进入此页面。</p><a href="http://console.localhost:3003/login">登录控制台</a>{{end}}<a class="back" href="http://console.localhost:3003">返回控制台</a></section><p class="footnote">恢复码不发送邮件，不保存到浏览器存储。此页面不修改认证器密钥。</p></main></body></html>
