<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Identity · 账户验证</title><link rel="stylesheet" href="/account/account.css"><script src="/account/account.js" defer></script></head><body>
<div class="local">本地开发环境 · 通知只投递到私有测试邮箱目录</div><main><a class="brand" href="/account">◈ Identity</a><div class="card"><p class="eyebrow">安全账户服务</p><h1 id="title">创建你的账户</h1><p class="muted" id="intro">先验证邮箱归属，再设置密码并创建个人空间。</p>
<form id="email-form"><label for="email">邮箱地址</label><input id="email" name="email" type="email" autocomplete="email" maxlength="254" required><button id="request" type="submit">发送验证说明</button></form>
<form id="password-form" hidden><label for="password">设置新密码</label><input id="password" name="password" type="password" autocomplete="new-password" minlength="12" maxlength="128" required aria-describedby="policy"><p class="muted" id="policy">使用 12–128 个字符。建议使用独立且足够长的密码。</p><label for="confirm">再次输入密码</label><input id="confirm" name="confirm" type="password" autocomplete="new-password" minlength="12" maxlength="128" required><button id="complete" type="submit">验证邮箱并创建账户</button></form>
<p id="status" role="status" aria-live="polite"></p><p id="error" role="alert"></p><button id="switch" type="button" class="link">已有账户，找回密码</button></div><p class="footnote">登录请从你的应用发起。完成验证不会自动登录。</p></main></body></html>
